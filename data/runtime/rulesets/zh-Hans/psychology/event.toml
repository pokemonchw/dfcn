[[rulesets]]
name = "building"
# Current experiences and recollections name the same furniture. Recollections
# omit near/seeing, not the article in "a fine Door". Keep ownership, quality
# and arrangement in one noun phrase, with the same semantic source origins.
[rulesets.rules]
"{^things::num}{building_own}{building_quility}{building_put} {building_name}" = "{building_own}{building_quility}{building_put}{building_name}"
# An invalid building type clears only the type name. The caller has already
# supplied its article/ownership, quality and arrangement; consume that whole
# native result without substituting for a prefix of a named building.
"a{building_quility}{building_put}" = "{building_quility}{building_put}建筑"
"{things::possessive}own{building_quility}{building_put}" = "{things::possessive}{building_quility}{building_put}建筑"

