base = "psychology::event"

[[rulesets]]
[rulesets.rules]
"{things}{tail}" = "{things}"

# Current thoughts place this circumstance after their subject. Recollections
# keep using the bare event namespace above, without an added 在 or time word.
[[rulesets]]
name = "situation"
[rulesets.rules]
"{situation::event}{tail}" = "{situation::event}"

[[rulesets]]
name = "situation::event"
[rulesets.rules]
"while in conflict{things::distance}" = "{things::distance}在冲突中"
"in conflict{things::distance}" = "{things::distance}在冲突中"
"due to" = "因某种症状的影响"
"due to {things::core}{things::distance}" = "因{things::distance}{things::core}"
"by {things::core}{things::distance}" = "因{things::distance}{things::core}"
"about {things::core}{things::distance}" = "对{things::distance}{things::core}这件事"
"that {things::core}{things::distance}" = "对{things::distance}{things::core}这件事"
"that a criminal could not be properly punished{things::distance}" = "对{things::distance}罪犯没有得到适当惩罚这件事"
"that nobody could be punished for a failure{things::distance}" = "对{things::distance}无人能因这次失败受到惩罚这件事"
"during" = "在某事件期间"
"{situation::time}{things::core::located}{things::distance}" = "{things::distance}{things::core::located}{situation::time}"
"{situation::time}{things::core::plain}{things::distance}" = "在{things::distance}{things::core::plain}{situation::time}"
"{things::core::located}{things::distance}" = "{things::distance}{things::core::located}时"
"{things::core::plain}{things::distance}" = "在{things::distance}{things::core::plain}时"

# A missing native time prefix is handled by the bare-event productions,
# rather than an optional prefix that would leave 在... without a time word.
[[rulesets]]
name = "situation::time"
[rulesets.rules]
"after " = "后"
"upon " = "后"
"when " = "时"
"while " = "时"
"at " = "时"
"during " = "期间"
"in " = "时"
"as " = "时"

# Thought and memory constructors share these events. The constructor owns the
# sentence stop, so the same event also works inside a recalled experience.
[[rulesets]]
name = "tail"
optional = true
[rulesets.rules]
"." = ""

[[rulesets]]
name = "things::prefix"
optional = true
[rulesets.rules]
"after " = "后"
"upon " = "后"
"when " = "时"
"while " = "时"
"at " = "时"
"during " = "期间"
"in " = "时"
"due to " = "所致"
"about " = "这件事"
"as " = "时"
"that " = "这件事"

[[rulesets]]
name = "things::haunted"
[rulesets.rules]
"haunted" = "纠缠"
"tormented" = "折磨"
"possessed" = "附身"
"tortured" = "摧残"

