base = "health::bodypart"

[[rulesets]]
[rulesets.rules]
# Native order is child, owner, tissue. Chinese puts the owner BEFORE the
# child; only the tissue remains a separate trailing health-detail field.
"{bodypart_main}{second_part}{main_tissue}" = "{second_part}{bodypart_main}{main_tissue}"

[[rulesets]]
name = "second_part"
optional = true
[rulesets.rules]
", {bodypart_main}" = "{bodypart_main}"

[[rulesets]]
name = "main_tissue"
optional = true
[rulesets.rules]
", {tissue}" = "·{tissue}"

