# Character headers append this honorific below the quoted personal name.
# The role parser queries ^0 with title-cased wording; the general caption
# parser retains native wording. Both own the complete artifact name and use
# the existing same-language name roots, including accented CP437 letters.
[[rulesets]]
name = "^0"
[rulesets.rules]
"Creator of {::text::native_item_name}" = "{::text::native_item_name}的创造者"
"Creator Of {::text::native_item_name}" = "{::text::native_item_name}的创造者"
