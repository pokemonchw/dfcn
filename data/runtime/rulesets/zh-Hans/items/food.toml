base = "items::food"

[[rulesets]]
[rulesets.rules]
"{::items::meat::^0}{main}" = "{::items::meat::^0}{main}"

[[rulesets]]
name = "main"
[rulesets.rules]
# Native filled-container captions use this category instead of a meal name.
# Keep it in the shared food vocabulary for containers and item descriptions.
"prepared food" = "熟食"
"prepared foods" = "熟食"
"prepared meal" = "预备的餐点"
"prepared meals" = "预备的餐点"
"{type}" = "{type}"
"{ingredient} {type}" = "{ingredient}{type}"

# ITEM_FOOD names come from vanilla_items/objects/item_food.txt. Tuple zero
# supplies the heading's food noun and appears last in the ingredient list.
# Quantities and quality marks belong to the enclosing item caption.
[[rulesets]]
name = "type"
[rulesets.rules]
# The title getter copies "Prepared Food" when the subtype is missing.
"prepared food" = "熟食"
"biscuit" = "饼干"
"biscuits" = "饼干"
"stew" = "炖菜"
"stews" = "炖菜"
"roast" = "烤菜"
"roasts" = "烤菜"

[[rulesets]]
name = "ingredient"
[rulesets.rules]
"{::items::plant}" = "{::items::plant}"
"{::items::plant_growth}" = "{::items::plant_growth}"
"{::items::meat}" = "{::items::meat}"
"{::items::fish}" = "{::items::fish}"
"{::items::fish_raw}" = "{::items::fish_raw}"
"{::items::vermin::main}" = "{::items::vermin::main}"
"{::items::egg}" = "{::items::egg}"
"{::items::seeds}" = "{::items::seeds}"
"{::items::drink}" = "{::items::drink}"
"{::items::cheese}" = "{::items::cheese}"
"{::items::powder_misc}" = "{::items::powder_misc}"
"{::items::liquid_glob}" = "{::items::liquid_glob}"
"{::materials}" = "{::materials}"
