base = "items::weapon"

[[rulesets]]
[rulesets.rules]
"{default}" = "{default}"
"{singular}" = "{singular}"
"{plural}" = "{plural}"

[[rulesets]]
name = "default"
[rulesets.rules]
"{default::^0}{default::main}" = "{default::^0}{default::main}"

[[rulesets]]
name = "default::^0"
optional = true
[rulesets.rules]
# Share complete item materials with native captions, including generated metals.
"{::materials::item_qualifier} " = "{::materials::item_qualifier}"

[[rulesets]]
name = "default::main"
[rulesets.rules]
"weapon" = "武器"
"weapons" = "武器"

[[rulesets]]
name = "singular"
[rulesets.rules]
"{^0}{^1}{singular::main}" = "{^0}{^1}{singular::main}"

[[rulesets]]
name = "plural"
[rulesets.rules]
"{^0}{^1}{plural::main}" = "{^0}{^1}{plural::main}"

[[rulesets]]
name = "^0"
optional = true
[rulesets.rules]
"{prefix}" = "{prefix}"

[[rulesets]]
name = "prefix"
[rulesets.rules]
"large " = "大"

[[rulesets]]
name = "^1"
optional = true
[rulesets.rules]
"{::materials::item_qualifier} " = "{::materials::item_qualifier}"

[[rulesets]]
name = "singular::main"
[rulesets.rules]
"whip" = "长鞭"
"battle axe" = "战斧"
"war hammer" = "战锤"
"short sword" = "短剑"
"spear" = "矛"
"mace" = "页锤"
"crossbow" = "十字弩"
"pick" = "鹤嘴锄"
"great pick" = "大鹤嘴锄"
"bow" = "弓"
"blowgun" = "吹管"
"pike" = "长枪"
