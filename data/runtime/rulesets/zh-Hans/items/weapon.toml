"two-handed sword" = "双手剑"
"long sword" = "长剑"
"maul" = "大锤"
"great axe" = "巨斧"
"dagger" = "匕首"
"scourge" = "散鞭"
"flail" = "连枷"
"morningstar" = "钉头锤"
"scimitar" = "短弯刀"
"training axe" = "训练斧"
"training sword" = "训练剑"
# The adventure carpenter reaction uses the full short-sword subtype name.
"training short sword" = "训练短剑"
"training spear" = "训练矛"
"{singular::generated}" = "{singular::generated}"

# Native procedural types also have singular names in item details. Keep
# these scoped so sword/knife skills and anatomical nails are not overwritten.
[[rulesets]]
name = "singular::generated"
[rulesets.rules]
"sword" = "剑"
"blade" = "刀刃"
"knife" = "短刀"
"nail" = "钉刺"
