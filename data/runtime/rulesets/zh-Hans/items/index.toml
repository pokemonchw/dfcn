base = "items"

[[rulesets]]
[rulesets.rules]
# Fertility follows the complete egg caption, including quantity and marks.
"{%item_designation:egg::with_number} (Fertile)" = "{%item_designation:egg::with_number}（已受精）"
"{%item_designation:with_number}" = "{%item_designation:with_number}"
# A knapped rock can start with quality glyphs belonging only to sharp.
# Let that typed production consume its own glyphs before the whole-item
# designation parser treats the initial glyph as an outer item wrapper.
"{rock::knapped}{$number}" = "{rock::knapped}{$number}"
"{::plants::name::singular}, {::plants::growth::plural}" = "{::plants::name::singular}、{::plants::growth::plural}"
"{::plants::name::plural}, {::plants::growth::plural}" = "{::plants::name::plural}、{::plants::growth::plural}"
"{::plants::name::singular}, {::plants::growth::singular}" = "{::plants::name::singular}、{::plants::growth::singular}"
"{::plants::growth::plural}, {plants_growth_plural_repeat}" = "{::plants::growth::plural}、{plants_growth_plural_repeat}"
"{::plants::growth::singular}, {plants_growth_singular_repeat}" = "{::plants::growth::singular}、{plants_growth_singular_repeat}"

[[rulesets]]
name = "plants_growth_plural_repeat"
[rulesets.rules]
"{::plants::growth::plural}" = "{::plants::growth::plural}"

[[rulesets]]
name = "plants_growth_singular_repeat"
[rulesets.rules]
"{::plants::growth::singular}" = "{::plants::growth::singular}"

[[rulesets]]
name = "with_number"
[rulesets.rules]
# 0xc65450 wraps the 0xca5bb0 -> 0xa82c10 type description in quality/wear
# marks; the grown prefix at 0xa82d8c therefore also occurs inside those marks.
"{grown}" = "{grown}"
"{main}{$number}" = "{main}{$number}"

# Supplied by the shared complete container-name resolver. No fallback rule
# may concatenate contents + vessel + a trailing material-only parenthesis.
[[rulesets]]
name = "storage_container"
[rulesets.rules]

# The existing container-content vocabulary also identifies group headings
# with no material parenthesis. Formatting still belongs to the one resolver.
[[rulesets]]
name = "storage_contents"
[rulesets.rules]
# Native barrel/tool content classes. These are goods, so their scoped noun
# meanings precede general UI words such as the Paste command.
"food" = "食物"
"mill" = "研磨产物"
"rendered fat" = "炼制脂肪"
"paste" = "糊状物"
"pressed material" = "压榨物"
"mixed" = "混合物"
"prepared food" = "烹制食物"
"seed" = "种子"
"fat" = "脂肪"
"leather" = "皮革"
"gem" = "宝石"
"{::items::bin::contents}" = "{::items::bin::contents}"
# Native liquid/material contents retain phase names, personal owners and
# generated substances through the complete material resolver.
"{::text::material}" = "{::text::material}"
"{::items::fish}" = "{::items::fish}"
"{::items::meat}" = "{::items::meat}"
"{::items::plant}" = "{::items::plant}"
"{::items::drink}" = "{::items::drink}"
"{::items::food}" = "{::items::food}"
"{::items::dye}" = "{::items::dye}"
"{::items::cheese}" = "{::items::cheese}"
"{::items::powder_misc}" = "{::items::powder_misc}"
"{::items::seeds}" = "{::items::seeds}"
"{::items::spice}" = "{::items::spice}"

# The typed corpse/body-component/remains entry uses the same designation
# replacer as all items. Keep the stable entry name used by captions, item
# detail prose and compositional phrases; its child owns all three classes.
[[rulesets]]
name = "corpsepiece::caption"
[rulesets.rules]
"{%item_designation:corpsepiece::with_number}" = "{%item_designation:corpsepiece::with_number}"

# Bind the designation replacer at the items base, as for corpsepiece.
# Complete plant seed names take precedence over animal/body-part grammar.
[[rulesets]]
name = "seeds::caption"
[rulesets.rules]
"{%item_designation:seeds::seed_with_number}" = "{%item_designation:seeds::seed_with_number}"

# Knapped rocks decorate only the sharpness adjective. As for complete item
# designations above, the replacer binding belongs to this base namespace.
[[rulesets]]
name = "rock::sharp_caption"
[rulesets.rules]
"{%item_designation:rock::sharp}" = "{%item_designation:rock::sharp}"

[[rulesets]]
name = "$number"
optional = true
[rulesets.rules]
" x{#digits}" = " x{#digits}"
# Native remaining-quantity captions put the percent sign after the digits.
" ({#digits}%)" = " ({#digits}%)"
" (%{#digits})" = " (%{#digits})"
" [{#digits}]" = " [{#digits}]"
" <#{#digits}>" = " <#{#digits}>"

[[rulesets]]
name = "^0"
optional = true
[rulesets.rules]
"grown " = "长出的"

