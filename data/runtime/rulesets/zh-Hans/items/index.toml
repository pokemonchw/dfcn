# 0xa8801a/0xa88046: the native unknown-type branch retains its material,
# item/items noun and normal quantity suffix. Designation marks remain outside.
[[rulesets]]
name = "fallback"
[rulesets.rules]
"item" = "物品"
"items" = "物品"
"{::materials::item_qualifier} item" = "{::materials::item_qualifier}物品"
"{::materials::item_qualifier} items" = "{::materials::item_qualifier}物品"

[[rulesets]]
name = "prefix::maybe_equipment_size"
optional = true
[rulesets.rules]
"{prefix::equipment_size} " = "{prefix::equipment_size}"

# Equipment specifications use the same reviewed forms in complete item rules
# and in native rows whose material and type are drawn as separate fields.
# Keep these meanings scoped to equipment; ordinary appearance terms retain
# their independent translations.
[[rulesets]]
name = "prefix::equipment_size"
[rulesets.rules]
"small" = "小型"
"large" = "大型"

[[rulesets]]
name = "prefix::equipment_modifier"
[rulesets.rules]
"{prefix::equipment_size}" = "{prefix::equipment_size}"
"little" = "小型"
"great" = "大型"
"tall" = "高挑"
"bulky" = "厚重"
