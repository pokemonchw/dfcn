"{::text::person}'s {::materials}" = "{::text::person}的{::materials}"
"{::text::person}'s {::materials::adjective}" = "{::text::person}的{::materials::adjective}"
# Native material.prefix + state_adj[Solid] may come from generated
# substances and historic-figure materials outside the finite RAW lexicons.
# Ordinary RAW grammar and the shared native qualifier resolver both handle
# complete material phrases; matcher weights select the resulting parse.
"{::materials::item_qualifier}" = "{::materials::item_qualifier}"

