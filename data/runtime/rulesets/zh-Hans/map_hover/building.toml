# DF 53.16 PE building caption virtual slot +0x188. The complete set of
# concrete building formatters and their literal/inline sources is retained
# in data/extracted/map-hover-building-sources.tsv. These are complete hover captions, so
# material, direction, state and contents cannot become detached word matches.
base = "map_hover::building"

[[rulesets]]
[rulesets.rules]
"{fixed}" = "{fixed}"
"{material} {furniture}" = "{material}{furniture}"
"{rough}{material} {rough_furniture}" = "{rough}{material}{rough_furniture}"
"Vertical {material} Bars" = "{material}垂直栅栏"
"{direction}{material} Axle" = "{direction}{material}传动轴"
"{weapon_state}{weapon_contents}" = "{weapon_state}{weapon_contents}"
"{construction}" = "{construction}"
"{workshop}" = "{workshop}"
"{::items::cage}" = "{::items::cage}"
# Offering places and display furniture return their first contained item;
# instruments and tool workshops also delegate to the complete item caption.
# Named artifacts return before the native quality/wear wrappers are added.
# Only validated native-language names may fill that fallback. Broad English
# artifact-title parsing would also swallow ordinary material + building text.
"{::items}" = "{::items}"
"{::text::native_item_name}" = "{::text::native_item_name}"
"Activity Zone #{#digits}" = "活动区 #{#digits}"
# Numbered stockpiles and all combinations of their 17 ordered categories
# are consumed by the existing complete Stockpile #{d} caption resolver.

