# 0x140554270: the state is independent of the contained-item count.
# A single item uses the shared complete designation grammar, including
# quality, wear and artifact names; empty/mixed/multiple contents are nouns.
[[rulesets]]
name = "weapon_state"
[rulesets.rules]
"Upright " = "直立的"
"Retracted " = "缩回的"

[[rulesets]]
name = "weapon_contents"
[rulesets.rules]
"Weapon" = "武器"
