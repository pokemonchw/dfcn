# PE 53.16 hover branch 2 calls 0x1330c30 in fortress mode and 0x132e430
# in adventure mode. Native identity/name/profession parsing remains shared.
# Only the formatter's finite outer states and appearance epithets live here.
base = "map_hover::unit"

[[rulesets]]
[rulesets.rules]
"you" = "你"
"{owned}" = "{owned}"
"{owned}{condition}" = "{owned}{condition}"
"{identity}{condition}" = "{identity}{condition}"
# A bare actor reference must not claim an item or building caption.
"force" = "神力"
"deity" = "神祇"
"ghost" = "幽灵"
"slave" = "奴隶"
"prisoner" = "囚犯"

[[rulesets]]
name = "owned"
[rulesets.rules]
"{article}{identity}" = "{identity}"
"{article}{state}{identity}" = "{state}{identity}"
"{article}{appearance_prefix}{identity}" = "{appearance_prefix}{identity}"
"{article}{state}{appearance_prefix}{identity}" = "{state}{appearance_prefix}{identity}"
"{state}{identity}" = "{state}{identity}"
"{state}{appearance_prefix}{identity}" = "{state}{appearance_prefix}{identity}"

[[rulesets]]
name = "article"
[rulesets.rules]
"the " = ""
"a " = ""

[[rulesets]]
name = "state"
[rulesets.rules]
"stray " = "无主的"
"fierce " = "凶猛的"
"agitated " = "躁动的"
"ghostly " = "幽灵形态的"
"stray ghostly " = "无主的幽灵形态的"
"fierce ghostly " = "凶猛的幽灵形态的"
"agitated ghostly " = "躁动的幽灵形态的"

[[rulesets]]
name = "identity"
[rulesets.rules]
"{::text::person}" = "{::text::person}"
"{::creatures::caste::singular}" = "{::creatures::caste::singular}"
"{::creatures::name::singular}" = "{::creatures::name::singular}"
"force" = "神力"
"deity" = "神祇"
"ghost" = "幽灵"
"corpse" = "尸体"
"slave" = "奴隶"
"prisoner" = "囚犯"

[[rulesets]]
name = "condition"
[rulesets.rules]
" slave" = "奴隶"
" prisoner" = "囚犯"
" corpse" = "的尸体"

[[rulesets]]
name = "appearance_prefix"
[rulesets.rules]
"{appearance} " = "{appearance}的"

# 0x717d30 chooses the most distinguishing feature and stores it at
# unit+0x13e8. 0x132f754 suppresses the sentinel "average" entirely.
[[rulesets]]
name = "appearance"
[rulesets.rules]
"{body_size}" = "{body_size}"
"{feature}-{part}" = "{part}{feature}"
# BROADNESS neutral dispatch (Steam 0x719df5 -> 0x71a09b; classic
# 0x717815 -> 0x717abb) skips the modifier assignment but still appends
# '-' and the complete RAW noun. It can extend an earlier selected epithet;
# the inherited appearance remains before this separately appended part.
"-{part}" = "{part}"
"{appearance}-{part}" = "{appearance}-{part}"
"high-cheekbones" = "颧骨高耸"
"low-cheekbones" = "颧骨低平"
"square-chin" = "方下巴"
"round-chin" = "圆下巴"
"massive-chin" = "下巴硕大"
"recessed-chin" = "下巴后缩"
"jutting-chin" = "下巴前突"
"prominent-chin" = "下巴突出"
"broad-chin" = "下巴宽阔"
"narrow-chin" = "下巴窄小"
"high-voiced" = "嗓音高亢"
"guttural-voiced" = "喉音浓重"
"grating-voiced" = "嗓音刺耳"
"clear-voiced" = "嗓音清亮"
"deep-voiced" = "嗓音低沉"
