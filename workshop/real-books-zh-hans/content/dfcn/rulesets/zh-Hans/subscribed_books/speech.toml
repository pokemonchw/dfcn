name = "military"
[rulesets.rules]
"\"You {::subscribed_books::speech::military::strategy} {::subscribed_books::speech::military::object} and call it a plan?\" {@bt_name|::subscribed_books::vocabulary::person} spat. \"It is a invitation to disaster.\"" = "“你对{::subscribed_books::speech::military::object}采取{::subscribed_books::speech::military::strategy}措施，还称之为计划？”{@bt_name|::subscribed_books::vocabulary::person}啐道，“这简直是在招灾。”"

