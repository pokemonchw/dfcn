[[rulesets]]
name = "stake2"
[rulesets.rules]
"{stake}" = "{stake}"

[[rulesets]]
name = "goal"
[rulesets.rules]
"bring the {object} home to {@bt_place|::subscribed_books::vocabulary::place}" = "把那件{object}带回{@bt_place|::subscribed_books::vocabulary::place}"
"find {@bt_victim|::subscribed_books::vocabulary::person}, or the truth of what happened" = "找到{@bt_victim|::subscribed_books::vocabulary::person}，或查明事情的真相"
"make {@bt_foe|::subscribed_books::vocabulary::person} answer for {@bt_victim|::subscribed_books::vocabulary::person}" = "让{@bt_foe|::subscribed_books::vocabulary::person}为{@bt_victim|::subscribed_books::vocabulary::person}的遭遇付出代价"
"take back what {@bt_foe|::subscribed_books::vocabulary::person} stole" = "夺回{@bt_foe|::subscribed_books::vocabulary::person}窃取的一切"
"win the seat of {@bt_office|::subscribed_books::plot_vocabulary::office}" = "赢得{@bt_office|::subscribed_books::plot_vocabulary::office}之位"
"read the {object} before {@bt_foe|::subscribed_books::vocabulary::person} can" = "抢在{@bt_foe|::subscribed_books::vocabulary::person}之前读到那件{object}"
"end the feud, or outlast it" = "结束世仇，或熬到它消亡"
"be free of the oath without breaking it" = "在不违背誓约的前提下摆脱它"
"find who killed {@bt_victim|::subscribed_books::vocabulary::person}" = "查出杀害{@bt_victim|::subscribed_books::vocabulary::person}的凶手"
"find the {object} and the hand that took it" = "找到那件{object}和偷走它的人"
"shed the borrowed name before it costs everything" = "赶在付出一切之前摆脱那个冒用的名字"
"find the {object} before {@bt_foe|::subscribed_books::vocabulary::person} asks for it back" = "赶在{@bt_foe|::subscribed_books::vocabulary::person}索还之前找回那件{object}"

