[[rulesets]]
name = "stake"
[rulesets.rules]
"the {object}" = "那件{object}"
"what became of {@bt_victim|::subscribed_books::vocabulary::person}" = "{@bt_victim|::subscribed_books::vocabulary::person}的下落"
