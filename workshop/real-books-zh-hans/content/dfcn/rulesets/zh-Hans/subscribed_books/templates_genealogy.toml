# templates.lua 917–1154：旧 Genealogy / BiographicalDictionary 各 5 视角，115 个非空展示模板。
# narrative.lua 的 lineage 只以递归亲属项解析，世界真实姓名原样保留。
base = "subscribed_books::templates_genealogy"

[[rulesets]]
[rulesets.rules]
"The lineage of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} is a {::subscribed_books::adj} thread woven through the tapestry of {@bt_entity|::subscribed_books::vocabulary::entity}. This genealogy traces the blood royal from its earliest known source." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的世系，如一根{::subscribed_books::adj}线，织入{@bt_entity|::subscribed_books::vocabulary::entity}的锦绣画卷。这部族谱从已知的最早源头追溯王室血脉。"
"Born in {@bt_birth_year|::subscribed_books::vocabulary::birth_year}, {@bt_hero|::subscribed_books::vocabulary::person} inherited not merely a name, but a dynasty. These are the ancestors and descendants of {::subscribed_books::personality::pos1} line." = "{@bt_hero|::subscribed_books::vocabulary::person}生于{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年，继承的不仅是姓氏，更是一个王朝。这里记录{::subscribed_books::personality::pos1}家系的祖先与后裔。"
"The genealogy of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}, is a record of power passed from generation to generation. The {::subscribed_books::adj} line stretches back through the ages, each link forged in blood and duty. Known kin: {lineage}." = "{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}），其族谱记录着权力的代代传承。{::subscribed_books::adj}世系绵延至久远的年代，每一环都由血与责任铸成。已知亲属：{lineage}。"
"The record continues with the branch of the family tree rooted in {@bt_year|::subscribed_books::vocabulary::birth_year}." = "记述继续追溯家族树中扎根于{@bt_year|::subscribed_books::vocabulary::birth_year}年的枝系。"
"In the period around {@bt_year|::subscribed_books::vocabulary::birth_year}, the lineage of {@bt_hero|::subscribed_books::vocabulary::person} expanded." = "在{@bt_year|::subscribed_books::vocabulary::birth_year}年前后，{@bt_hero|::subscribed_books::vocabulary::person}的世系有所扩展。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} died in {@bt_year|::subscribed_books::vocabulary::birth_year} by {@bt_cause|::subscribed_books::vocabulary::cause}. The crown passed on." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_year|::subscribed_books::vocabulary::birth_year}年死于{@bt_cause|::subscribed_books::vocabulary::cause}。王冠传给了后来者。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, {@bt_cause|::subscribed_books::vocabulary::cause} took {@bt_hero|::subscribed_books::vocabulary::person}. The line continued through {::subscribed_books::personality::pos1} heirs." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_cause|::subscribed_books::vocabulary::cause}夺走了{@bt_hero|::subscribed_books::vocabulary::person}的生命。世系通过{::subscribed_books::personality::pos1}继承人延续。"
"{@bt_hero|::subscribed_books::vocabulary::person} was named {@bt_role|::subscribed_books::vocabulary::role} in {@bt_year|::subscribed_books::vocabulary::birth_year}, continuing the family tradition of leadership." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年被任命为{@bt_role|::subscribed_books::vocabulary::role}，延续了家族领导众人的传统。"
"The year {@bt_year|::subscribed_books::vocabulary::birth_year} saw the {::subscribed_books::adj} line of {@bt_hero|::subscribed_books::vocabulary::person} grow and branch." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_hero|::subscribed_books::vocabulary::person}的{::subscribed_books::adj}世系成长，并开枝散叶。"
"The blood endures. The line continues." = "血脉长存，世系延续。"
"Such is the royal genealogy of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. The line stretches from {@bt_birth_year|::subscribed_books::vocabulary::birth_year} into the uncertain future." = "这便是{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的王室族谱。世系从{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年绵延至尚不可知的未来。"
"The genealogy of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} is a {::subscribed_books::adj} monument to the persistence of bloodlines. Through war, plague, and the slow erosion of time, the line endures. Known connections: {lineage}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的族谱，是血脉坚韧延续的一座{::subscribed_books::adj}丰碑。历经战争、瘟疫与时间的缓慢侵蚀，世系依然长存。已知亲属关系：{lineage}。"
"The ancestors of {@bt_hero|::subscribed_books::vocabulary::person} were unremarkable folk. Nobody would have guessed what their line would produce." = "{@bt_hero|::subscribed_books::vocabulary::person}的祖先只是寻常百姓。没有人能猜到，这一家系日后会孕育怎样的人物。"
"Before {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, the family name meant nothing. This genealogy traces how obscurity gave way to renown." = "在{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）之前，这个家族的姓氏默默无闻。这部族谱追溯无名之家如何声名远扬。"
"Great trees grow from small seeds. The genealogy of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} begins in {::subscribed_books::adj} obscurity -- generations of unnamed {::subscribed_books::vocabulary::race} folk whose only legacy was the bloodline that would, in time, produce a figure worthy of record. Known kin: {lineage}." = "参天大树也始于小小种子。{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的族谱始于{::subscribed_books::adj}无闻岁月——一代代未留姓名的{::subscribed_books::vocabulary::race}百姓，唯一的遗产便是那条血脉；终有一天，它孕育出值得载入史册的人物。已知亲属：{lineage}。"
"Around {@bt_year|::subscribed_books::vocabulary::birth_year}, the family's fortunes began to shift." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年前后，家族的命运开始转变。"
"The death of {@bt_hero|::subscribed_books::vocabulary::person} in {@bt_year|::subscribed_books::vocabulary::birth_year} threatened to return the family to the obscurity from which it had risen." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的死亡，使这个家族面临重新陷入旧日无名境地的危险。"
"When {@bt_hero|::subscribed_books::vocabulary::person} became {@bt_role|::subscribed_books::vocabulary::role} in {@bt_year|::subscribed_books::vocabulary::birth_year}, it was the culmination of generations of slow ascent." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年成为{@bt_role|::subscribed_books::vocabulary::role}，这是数代人缓慢崛起的顶点。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the line of {@bt_hero|::subscribed_books::vocabulary::person} crept one step further from its humble origins." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_hero|::subscribed_books::vocabulary::person}的家系又向前迈进了一步，渐渐远离卑微的出身。"
"Inch by inch, generation by generation, the family rose." = "一点一点，一代又一代，家族逐渐崛起。"
"From nothing to {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. The genealogy of the family is proof that greatness can emerge from anywhere." = "从一无所有到{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。这个家族的族谱证明，伟大可以从任何地方萌芽。"
"The {::subscribed_books::adj} arc of this genealogy bends from obscurity toward greatness. {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} is not the beginning of the story, nor -- one hopes -- its end. Known connections: {lineage}." = "这部族谱的{::subscribed_books::adj}轨迹，从默默无闻弯向伟大。{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）并非故事的起点，也希望不是它的终点。已知亲属关系：{lineage}。"
"There are families that seem marked by fate. The lineage of {@bt_hero|::subscribed_books::vocabulary::person} is one such cursed line." = "有些家族仿佛被命运标记。{@bt_hero|::subscribed_books::vocabulary::person}的世系便是这样一条受诅咒的血脉。"
"Misfortune follows the blood of {@bt_hero|::subscribed_books::vocabulary::person}. Generation after generation, the pattern repeats." = "厄运紧随{@bt_hero|::subscribed_books::vocabulary::person}的血脉，一代又一代，反复重演。"
"The genealogy of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} reads less like a family record and more like a catalogue of {::subscribed_books::adj} doom. Whether by curse, by coincidence, or by some flaw woven into the blood itself, this line has known more than its share of suffering. Known kin: {lineage}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的族谱，与其说是家族记录，更像一部{::subscribed_books::adj}劫难名录。无论源自诅咒、巧合，还是血脉中某种与生俱来的缺陷，这一家系承受的苦难远超常人。已知亲属：{lineage}。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the curse claimed another." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，诅咒又夺去一个生命。"
"{@bt_hero|::subscribed_books::vocabulary::person} died in {@bt_year|::subscribed_books::vocabulary::birth_year}. {@bt_cause|::subscribed_books::vocabulary::cause}. Another life cut short in a family that has known too many early graves." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世。死因是{@bt_cause|::subscribed_books::vocabulary::cause}。这个家族已有太多过早出现的坟墓，如今又一条生命戛然而止。"
"The death of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} in {@bt_year|::subscribed_books::vocabulary::birth_year} was, tragically, consistent with the {::subscribed_books::adj} pattern of {::subscribed_books::personality::pos1} bloodline." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）于{@bt_year|::subscribed_books::vocabulary::birth_year}年的死亡，可悲地应验了{::subscribed_books::personality::pos1}血脉中{::subscribed_books::adj}反复出现的厄运。"
"The year {@bt_year|::subscribed_books::vocabulary::birth_year} passed. The curse slept, but it did not leave." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年过去了。诅咒虽在沉睡，却从未离去。"
"The pattern holds. The bloodline endures, and suffers." = "厄运依旧。血脉在延续，也在受苦。"
"The cursed genealogy of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} continues. Whether the line will ever break free of its doom, only time will tell." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）那受诅咒的族谱仍在续写。这一家系能否挣脱厄运，唯有时间能给出答案。"
"This {::subscribed_books::adj} genealogy is a record of sorrow passed from parent to child like a dark inheritance. {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} carried it. {::subscribed_books::personality::pos1} descendants will carry it still. Known connections: {lineage}." = "这部{::subscribed_books::adj}族谱，记录着如黑暗遗产般由父母传给子女的悲伤。{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）曾背负它，{::subscribed_books::personality::pos1}后裔也将继续背负。已知亲属关系：{lineage}。"
"The descendants of {@bt_hero|::subscribed_books::vocabulary::person} are scattered across the world. This genealogy traces where the seeds fell." = "{@bt_hero|::subscribed_books::vocabulary::person}的后裔散布世界各地。这部族谱追寻那些种子落在了何处。"
"From a single root, many branches. The family of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} spread far and wide." = "一根同源，万枝分生。{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的家族散布到了遥远的四方。"
"The genealogy of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} is not a single line but a {::subscribed_books::adj} web, stretching across sites and civilizations. Wars, migrations, and the simple restlessness of the {::subscribed_books::vocabulary::race} spirit scattered {::subscribed_books::personality::pos1} descendants to the winds. Known kin: {lineage}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的族谱并非单一世系，而是一张横跨聚落与文明的{::subscribed_books::adj}网络。战争、迁徙，以及{::subscribed_books::vocabulary::race}心中单纯的不安分，使{::subscribed_books::personality::pos1}后裔随风散往四方。已知亲属：{lineage}。"
"By {@bt_year|::subscribed_books::vocabulary::birth_year}, the family had put down roots in yet another place." = "到{@bt_year|::subscribed_books::vocabulary::birth_year}年，家族又在另一个地方扎下了根。"
"{@bt_hero|::subscribed_books::vocabulary::person} died in {@bt_year|::subscribed_books::vocabulary::birth_year}, far from where {::subscribed_books::personality::pro1} was born. Even in death, the scattering continued." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世，远离{::subscribed_books::personality::pro1}的出生之地。即使面对死亡，离散仍在继续。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, descendants of {@bt_hero|::subscribed_books::vocabulary::person}'s line were among the founders of {@bt_evsite|::subscribed_books::vocabulary::place}." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_hero|::subscribed_books::vocabulary::person}这一家系的后裔参与创建了{@bt_evsite|::subscribed_books::vocabulary::place}。"
"The year {@bt_year|::subscribed_books::vocabulary::birth_year} found the bloodline of {@bt_hero|::subscribed_books::vocabulary::person} in new and distant places." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_hero|::subscribed_books::vocabulary::person}的血脉已出现在新的遥远土地上。"
"Farther and farther, the family spread." = "越来越远，家族不断散布。"
"The seeds of {@bt_hero|::subscribed_books::vocabulary::person}'s line have taken root in places {::subscribed_books::personality::pro1} never dreamed of. The genealogy is a map of diaspora." = "{@bt_hero|::subscribed_books::vocabulary::person}这一家系的种子，已在{::subscribed_books::personality::pro1}从未梦见过的地方扎根。这部族谱是一幅离散地图。"
"Where are the children of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} now? Everywhere, and nowhere one might expect. This {::subscribed_books::adj} genealogy is a record of dispersal, of roots pulled up and replanted, of a family defined not by place but by blood. Known connections: {lineage}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的子女如今身在何方？遍布各地，却又尽在人们意想不到的地方。这部{::subscribed_books::adj}族谱记录着离散，记录着根被拔起后重新栽下，也记录着一个以血脉而非居所相系的家族。已知亲属关系：{lineage}。"
"Generation after generation, the line of {@bt_hero|::subscribed_books::vocabulary::person} endures. This genealogy celebrates the unbroken chain." = "一代又一代，{@bt_hero|::subscribed_books::vocabulary::person}的家系延续不息。这部族谱歌颂那条未曾断裂的链。"
"Continuity is the rarest of gifts. The family of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} has preserved it across the ages." = "延续是最稀有的馈赠。{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的家族让它历经岁月而长存。"
"In a world of {::subscribed_books::adj} upheaval, where nations rise and fall like waves, the bloodline of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} has endured without interruption. This genealogy traces the unbroken chain from {@bt_birth_year|::subscribed_books::vocabulary::birth_year} to the present day. Known kin: {lineage}." = "在这个{::subscribed_books::adj}动荡世界，国度如波浪般兴衰，{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的血脉却从未中断。这部族谱追溯从{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年至今的完整传承。已知亲属：{lineage}。"
"In {@bt_year|::subscribed_books::vocabulary::birth_year}, the chain added another link." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，传承的链条又增添了一环。"
"{@bt_hero|::subscribed_books::vocabulary::person} died in {@bt_year|::subscribed_books::vocabulary::birth_year}, but the chain did not break. {::subscribed_books::personality::pos1} heirs carried the name forward." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年去世，但链条并未断裂。{::subscribed_books::personality::pos1}继承人继续传承这个姓氏。"
"{@bt_hero|::subscribed_books::vocabulary::person} became {@bt_role|::subscribed_books::vocabulary::role} in {@bt_year|::subscribed_books::vocabulary::birth_year}, as {::subscribed_books::personality::pos1} ancestors had before {::subscribed_books::personality::obj1}." = "{@bt_hero|::subscribed_books::vocabulary::person}于{@bt_year|::subscribed_books::vocabulary::birth_year}年成为{@bt_role|::subscribed_books::vocabulary::role}，正如{::subscribed_books::personality::obj1}之前的祖先所做的那样。"
"The year {@bt_year|::subscribed_books::vocabulary::birth_year} saw the {::subscribed_books::adj} continuity of {@bt_hero|::subscribed_books::vocabulary::person}'s line preserved." = "{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_hero|::subscribed_books::vocabulary::person}一家{::subscribed_books::adj}延绵的世系得以继续。"
"Link by link, the chain holds." = "环环相扣，链条长存。"
"The unbroken chain of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} stretches from the past into the future. May it never be severed." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）那条未曾断裂的链，从过去绵延至未来。愿它永不斩断。"
"This genealogy is a testament to the {::subscribed_books::adj} power of continuity. Where others broke, the line of {@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet} held. Known connections: {lineage}. The chain endures." = "这部族谱见证了延续所蕴含的{::subscribed_books::adj}力量。别家断绝之处，{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）的家系仍然长存。已知亲属关系：{lineage}。链条依然延续。"
"Herein are recorded the lives of the {::subscribed_books::adj} and the worthy. Let their names be spoken with honor." = "此处记录着{::subscribed_books::adj}人物与值得敬重者的一生。愿他们的名字被尊敬地传颂。"
"This biographical dictionary preserves the deeds of those who shaped the world. {figure_count} figures are honored in these pages." = "这部人物辞典保存了塑造世界者的功业。书中向{figure_count}位人物致敬。"
"The hall of heroes is not a place of stone, but of memory. This dictionary enshrines {figure_count} figures whose {::subscribed_books::adj} deeds earned them a place in the permanent record of {@bt_entity|::subscribed_books::vocabulary::entity}. May their names ring out across the ages." = "英雄之殿并非筑于石头，而是筑于记忆。这部辞典铭刻{figure_count}位人物：他们{::subscribed_books::adj}功业使其名永载{@bt_entity|::subscribed_books::vocabulary::entity}的史册。愿这些名字响彻千秋。"
"The next entry in the hall of heroes:" = "英雄之殿的下一条记录："
"Another {::subscribed_books::adj} name to remember:" = "又一个值得铭记的{::subscribed_books::adj}名字："
"The record continues with the following figure:" = "记述继续介绍以下人物："
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: born {@bt_birth_year|::subscribed_books::vocabulary::birth_year}, died {@bt_year|::subscribed_books::vocabulary::birth_year}. Cause: {@bt_cause|::subscribed_books::vocabulary::cause}. Location: {@bt_evsite|::subscribed_books::vocabulary::place}. {::subscribed_books::personality::pro1} served with {::subscribed_books::adj} distinction and will not be forgotten." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：生于{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年，卒于{@bt_year|::subscribed_books::vocabulary::birth_year}年。死因：{@bt_cause|::subscribed_books::vocabulary::cause}。地点：{@bt_evsite|::subscribed_books::vocabulary::place}。{::subscribed_books::personality::pro1}的{::subscribed_books::adj}卓著贡献不会被遗忘。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}, {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}. Lived from {@bt_birth_year|::subscribed_books::vocabulary::birth_year} to {@bt_year|::subscribed_books::vocabulary::birth_year}. Fell to {@bt_cause|::subscribed_books::vocabulary::cause}. A hero in the truest sense." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}），{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}。生于{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年，卒于{@bt_year|::subscribed_books::vocabulary::birth_year}年。死于{@bt_cause|::subscribed_books::vocabulary::cause}。一位名副其实的英雄。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: named {@bt_role|::subscribed_books::vocabulary::role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@bt_year|::subscribed_books::vocabulary::birth_year}. A {::subscribed_books::adj} appointment that honored both the title and the bearer." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：于{@bt_year|::subscribed_books::vocabulary::birth_year}年被任命为{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_role|::subscribed_books::vocabulary::role}。这项{::subscribed_books::adj}任命，让职位与任职者同享荣耀。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: creator of {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year}. {::subscribed_books::personality::pos1} {::subscribed_books::adj} craftsmanship brought glory to {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造了{@bt_artifact|::subscribed_books::vocabulary::artifact}。{::subscribed_books::personality::pos1}{::subscribed_books::adj}工艺为{@bt_entity|::subscribed_books::vocabulary::entity}带来荣耀。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: a {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity} whose deeds in {@bt_year|::subscribed_books::vocabulary::birth_year} earned {::subscribed_books::personality::obj1} a place in these pages." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}，{::subscribed_books::personality::obj1}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的功业为其赢得了书中的一席之地。"
"So reads the entry. Let it stand." = "记录如上，愿其长存。"
"The hall of heroes stands complete. {figure_count} names, each one a light against the dark." = "英雄之殿已告完成。{figure_count}个名字，每个都是抵御黑暗的一束光。"
"This biographical dictionary is a {::subscribed_books::adj} monument to the individuals who, through courage, skill, or sacrifice, elevated the world around them. May the hall of heroes never stand empty." = "这部人物辞典，是献给那些以勇气、技艺或牺牲提升周围世界者的一座{::subscribed_books::adj}丰碑。愿英雄之殿永不空落。"
"Not all who are remembered deserve admiration. This dictionary catalogues the {::subscribed_books::adj} and the dangerous." = "并非所有被铭记的人都值得仰慕。这部辞典收录{::subscribed_books::adj}人物与危险人物。"
"Let this serve as a warning. The figures recorded here are remembered not for virtue, but for the damage they caused." = "愿此书成为警示。这里的人物因其造成的伤害，而非美德，被后人记住。"
"History is written by the victors, but the rogues gallery is written by the survivors. The {figure_count} figures in this dictionary earned their infamy through acts of {::subscribed_books::adj} ambition, cruelty, or spectacular folly." = "历史由胜者书写，恶徒名录却由幸存者书写。这部辞典中的{figure_count}位人物，因{::subscribed_books::adj}野心、残酷行径或惊人的愚行而臭名远扬。"
"The next scoundrel in the gallery:" = "名录中的下一个恶棍："
"Another entry in the catalogue of infamy:" = "恶名录中的另一条记录："
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: met a fitting end in {@bt_year|::subscribed_books::vocabulary::birth_year} by {@bt_cause|::subscribed_books::vocabulary::cause}. Few mourned." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：于{@bt_year|::subscribed_books::vocabulary::birth_year}年死于{@bt_cause|::subscribed_books::vocabulary::cause}，得到了应有的结局。鲜有人为之哀悼。"
"{@bt_hero|::subscribed_books::vocabulary::person}, {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}. Died {@bt_year|::subscribed_books::vocabulary::birth_year}. The world improved marginally upon {::subscribed_books::personality::pos1} departure." = "{@bt_hero|::subscribed_books::vocabulary::person}，{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}。卒于{@bt_year|::subscribed_books::vocabulary::birth_year}年。{::subscribed_books::personality::pos1}离去，使世界稍稍好了一些。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: seized the role of {@bt_role|::subscribed_books::vocabulary::role} in {@bt_year|::subscribed_books::vocabulary::birth_year}. A position {::subscribed_books::personality::pro1} used entirely for {::subscribed_books::personality::pos1} own {::subscribed_books::adj} ends." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：于{@bt_year|::subscribed_books::vocabulary::birth_year}年夺得{@bt_role|::subscribed_books::vocabulary::role}之位。{::subscribed_books::personality::pro1}利用这个职位，完全服务于{::subscribed_books::personality::pos1}自身{::subscribed_books::adj}目的。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: a {::subscribed_books::vocabulary::race} whose actions in {@bt_year|::subscribed_books::vocabulary::birth_year} earned {::subscribed_books::personality::obj1} a place in this unflattering record." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：一名{::subscribed_books::vocabulary::race}，{::subscribed_books::personality::obj1}于{@bt_year|::subscribed_books::vocabulary::birth_year}年的行径使其在这部并不光彩的记录中占得一席。"
"The record speaks for itself." = "记录本身已说明一切。"
"Let this rogues gallery serve as a warning to those who would follow in their footsteps." = "愿这部恶徒名录，成为那些打算步其后尘者的警示。"
"The {figure_count} rogues catalogued herein are not celebrated. They are exhibited, {::subscribed_books::templates_legacy::metaphor}, as cautionary specimens for the edification of a {::subscribed_books::adj} posterity." = "这里收录的{figure_count}名恶徒，未获颂扬。他们被陈列出来，{::subscribed_books::templates_legacy::metaphor}，作为警示的标本，启迪{::subscribed_books::adj}后人。"
"The {figure_count} rogues catalogued herein are not celebrated. They are exhibited, , as cautionary specimens for the edification of a {::subscribed_books::adj} posterity." = "这里收录的{figure_count}名恶徒，未获颂扬。他们被陈列出来，作为警示的标本，启迪{::subscribed_books::adj}后人。"
"The {figure_count} rogues catalogued herein are not celebrated. They are exhibited, as cautionary specimens for the edification of a {::subscribed_books::adj} posterity." = "这里收录的{figure_count}名恶徒，未获颂扬。他们被陈列出来，作为警示的标本，启迪{::subscribed_books::adj}后人。"
"A reference guide to notable figures. {figure_count} entries follow." = "一部介绍著名人物的参考指南。以下共有{figure_count}条记录。"
"This biographical dictionary provides factual accounts of prominent individuals associated with {@bt_entity|::subscribed_books::vocabulary::entity}." = "这部人物辞典据实记载与{@bt_entity|::subscribed_books::vocabulary::entity}有关的杰出人物。"
"The following {figure_count} biographical entries are presented without editorial commentary. The reader is invited to draw {::subscribed_books::personality::pos1} own conclusions from the {::subscribed_books::adj} facts." = "以下{figure_count}条传记记录，不附作者评论。请读者根据{::subscribed_books::adj}事实得出{::subscribed_books::personality::pos1}自己的结论。"
"Entry:" = "条目："
"Next figure:" = "下一位人物："
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. {::subscribed_books::vocabulary::race}, {@bt_entity|::subscribed_books::vocabulary::entity}. Born {@bt_birth_year|::subscribed_books::vocabulary::birth_year}. Died {@bt_year|::subscribed_books::vocabulary::birth_year}, {@bt_cause|::subscribed_books::vocabulary::cause}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。{::subscribed_books::vocabulary::race}，{@bt_entity|::subscribed_books::vocabulary::entity}。生于{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年。卒于{@bt_year|::subscribed_books::vocabulary::birth_year}年，死于{@bt_cause|::subscribed_books::vocabulary::cause}。"
"{@bt_hero|::subscribed_books::vocabulary::person}: {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}. Deceased, year {@bt_year|::subscribed_books::vocabulary::birth_year}. Cause: {@bt_cause|::subscribed_books::vocabulary::cause}." = "{@bt_hero|::subscribed_books::vocabulary::person}：{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}。已故，卒于{@bt_year|::subscribed_books::vocabulary::birth_year}年。死因：{@bt_cause|::subscribed_books::vocabulary::cause}。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. Appointed {@bt_role|::subscribed_books::vocabulary::role} of {@bt_entity|::subscribed_books::vocabulary::entity}, year {@bt_year|::subscribed_books::vocabulary::birth_year}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。于{@bt_year|::subscribed_books::vocabulary::birth_year}年被任命为{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_role|::subscribed_books::vocabulary::role}。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. Creator of {@bt_artifact|::subscribed_books::vocabulary::artifact}, year {@bt_year|::subscribed_books::vocabulary::birth_year}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造了{@bt_artifact|::subscribed_books::vocabulary::artifact}。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}. Active circa {@bt_year|::subscribed_books::vocabulary::birth_year}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}。约于{@bt_year|::subscribed_books::vocabulary::birth_year}年活跃。"
"End of entries." = "条目结束。"
"This dictionary contains {figure_count} entries. The author makes no claim to completeness." = "这部辞典收录{figure_count}条记录。作者并不宣称它涵盖所有人物。"
"In memoriam. This dictionary remembers those who have passed from the world." = "谨以纪念。这部辞典追思那些已离开世界的人。"
"They are gone, but they are not forgotten. These pages hold the names of the {::subscribed_books::adj} departed." = "他们已经离去，却未被遗忘。这些书页保存{::subscribed_books::adj}逝者的名字。"
"Memory is the last gift we give to the dead. This biographical dictionary preserves {figure_count} souls who walked the earth and left it changed. Each entry is a small {::subscribed_books::adj} candle lit against the vast dark of forgetting." = "记忆是我们给予死者的最后礼物。这部人物辞典留存{figure_count}个灵魂：他们曾行走于大地，并让世界有所改变。每条记录都如一支{::subscribed_books::adj}小蜡烛，在遗忘的浩瀚黑暗中燃起。"
"Remembered:" = "谨记："
"Another light gone from the world:" = "又一束光从世界上消失了："
"In memoriam:" = "谨以纪念："
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. We remember {::subscribed_books::personality::obj1}. {::subscribed_books::personality::pro1} was taken from us in {@bt_year|::subscribed_books::vocabulary::birth_year} by {@bt_cause|::subscribed_books::vocabulary::cause}. Born {@bt_birth_year|::subscribed_books::vocabulary::birth_year}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。我们铭记{::subscribed_books::personality::obj1}。{@bt_year|::subscribed_books::vocabulary::birth_year}年，{@bt_cause|::subscribed_books::vocabulary::cause}使{::subscribed_books::personality::pro1}离我们而去。生于{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年。"
"{@bt_hero|::subscribed_books::vocabulary::person}, {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}. Departed in {@bt_year|::subscribed_books::vocabulary::birth_year}. {@bt_cause|::subscribed_books::vocabulary::cause} took {::subscribed_books::personality::obj1}, but not {::subscribed_books::personality::pos1} memory." = "{@bt_hero|::subscribed_books::vocabulary::person}，{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}。于{@bt_year|::subscribed_books::vocabulary::birth_year}年离世。{@bt_cause|::subscribed_books::vocabulary::cause}夺走了{::subscribed_books::personality::obj1}，却夺不走关于{::subscribed_books::personality::pos1}人生的记忆。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. Once {@bt_role|::subscribed_books::vocabulary::role} of {@bt_entity|::subscribed_books::vocabulary::entity}. Now at rest." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。曾是{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_role|::subscribed_books::vocabulary::role}，如今已安息。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}. {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity}. Remembered with {::subscribed_books::adj} respect." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）。{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}。我们以{::subscribed_books::adj}敬意追思。"
"Rest well." = "安息吧。"
"These are the departed. May they find peace." = "这些便是逝者。愿他们得享安宁。"
"This dictionary of the {::subscribed_books::adj} departed is now complete. {figure_count} names. {::subscribed_books::templates_genealogy::ref_repeat_1} lives. Each one irreplaceable. {::subscribed_books::templates_legacy::metaphor} May we honor them by living well." = "这部{::subscribed_books::adj}逝者辞典已经完成。{figure_count}个名字，{::subscribed_books::templates_genealogy::ref_repeat_1}段人生，每个都无可替代。{::subscribed_books::templates_legacy::metaphor}愿我们好好生活，以此向他们致敬。"
"This dictionary of the {::subscribed_books::adj} departed is now complete. {figure_count} names. {::subscribed_books::templates_genealogy::ref_repeat_1} lives. Each one irreplaceable. May we honor them by living well." = "这部{::subscribed_books::adj}逝者辞典已经完成。{figure_count}个名字，{::subscribed_books::templates_genealogy::ref_repeat_1}段人生，每个都无可替代。愿我们好好生活，以此向他们致敬。"
"Every civilization stands upon the shoulders of its greatest citizens. This dictionary honors the pillars of {@bt_entity|::subscribed_books::vocabulary::entity}." = "每个文明都站在其最伟大公民的肩上。这部辞典向{@bt_entity|::subscribed_books::vocabulary::entity}的支柱致敬。"
"Without these individuals, {@bt_entity|::subscribed_books::vocabulary::entity} would not be what it is. This work acknowledges their {::subscribed_books::adj} contributions." = "没有这些人物，{@bt_entity|::subscribed_books::vocabulary::entity}便不会是今天的模样。这部作品铭记他们{::subscribed_books::adj}贡献。"
"{@bt_entity|::subscribed_books::vocabulary::entity} was not built by accident. It was shaped, stone by stone, by {figure_count} individuals whose contributions are recorded in this {::subscribed_books::adj} biographical dictionary. Each entry is a load-bearing pillar in the edifice of a civilization." = "{@bt_entity|::subscribed_books::vocabulary::entity}并非偶然建成。它由{figure_count}个人物一石一石地塑成；他们的贡献收录于这部{::subscribed_books::adj}人物辞典。每条记录都是文明大厦中的一根承重支柱。"
"Another pillar of {@bt_entity|::subscribed_books::vocabulary::entity}:" = "{@bt_entity|::subscribed_books::vocabulary::entity}的又一根支柱："
"Next among the builders:" = "下一位建设者："
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: a {::subscribed_books::adj} pillar of {@bt_entity|::subscribed_books::vocabulary::entity}, born {@bt_birth_year|::subscribed_books::vocabulary::birth_year}, fallen {@bt_year|::subscribed_books::vocabulary::birth_year}. {::subscribed_books::personality::pos1} contribution endures beyond {::subscribed_books::templates_genealogy::ref_repeat_2} death." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：{@bt_entity|::subscribed_books::vocabulary::entity}的一根{::subscribed_books::adj}支柱，生于{@bt_birth_year|::subscribed_books::vocabulary::birth_year}年，卒于{@bt_year|::subscribed_books::vocabulary::birth_year}年。{::subscribed_books::personality::pos1}贡献在{::subscribed_books::templates_genealogy::ref_repeat_2}死后依然长存。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: as {@bt_role|::subscribed_books::vocabulary::role} of {@bt_entity|::subscribed_books::vocabulary::entity} from {@bt_year|::subscribed_books::vocabulary::birth_year}, {::subscribed_books::personality::pro1} strengthened the foundations of the civilization." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：自{@bt_year|::subscribed_books::vocabulary::birth_year}年起担任{@bt_entity|::subscribed_books::vocabulary::entity}的{@bt_role|::subscribed_books::vocabulary::role}，{::subscribed_books::personality::pro1}巩固了文明的根基。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: creator of {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@bt_year|::subscribed_books::vocabulary::birth_year}, a {::subscribed_books::adj} contribution to the cultural wealth of {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：于{@bt_year|::subscribed_books::vocabulary::birth_year}年创造了{@bt_artifact|::subscribed_books::vocabulary::artifact}，为{@bt_entity|::subscribed_books::vocabulary::entity}的文化财富作出{::subscribed_books::adj}贡献。"
"{@bt_hero|::subscribed_books::vocabulary::person} {::subscribed_books::vocabulary::epithet}: a {::subscribed_books::vocabulary::race} of {@bt_entity|::subscribed_books::vocabulary::entity} whose work in {@bt_year|::subscribed_books::vocabulary::birth_year} made the world a more {::subscribed_books::adj} place." = "{@bt_hero|::subscribed_books::vocabulary::person}（{::subscribed_books::vocabulary::epithet}）：{@bt_entity|::subscribed_books::vocabulary::entity}的{::subscribed_books::vocabulary::race}，在{@bt_year|::subscribed_books::vocabulary::birth_year}年的工作使世界成为更加{::subscribed_books::adj}地方。"
"The civilization stands because they stood first." = "文明能够屹立，是因为他们先站了起来。"
"These are the pillars of {@bt_entity|::subscribed_books::vocabulary::entity}. Without them, the edifice crumbles." = "这些便是{@bt_entity|::subscribed_books::vocabulary::entity}的支柱。没有他们，大厦将会崩塌。"
"The biographical dictionary of {@bt_entity|::subscribed_books::vocabulary::entity}'s pillars is a record of the {::subscribed_books::adj} individuals who gave their civilization its shape, its strength, and its soul. May future generations add their own names to these pages." = "{@bt_entity|::subscribed_books::vocabulary::entity}的支柱人物辞典，记录那些赋予文明形态、力量与灵魂的{::subscribed_books::adj}人物。愿后世在这些书页上继续添入自己的名字。"

