# fiction_world.lua 的五族虚构姓名词池；仅供书籍人物槽使用。
# 每族按原作的名、姓前缀和后缀组合，不推断用户自定义名称。
base = "subscribed_books::fiction_names"

[[rulesets]]
name = "person"
[rulesets.rules]
"{dwarf_given} {dwarf_surname}" = "{dwarf_given}·{dwarf_surname}"
"{elf_given} {elf_surname}" = "{elf_given}·{elf_surname}"
"{human_given} {human_surname}" = "{human_given}·{human_surname}"
"{goblin_given} {goblin_surname}" = "{goblin_given}·{goblin_surname}"
"{kobold_given} {kobold_surname}" = "{kobold_given}·{kobold_surname}"
# 失踪或遇害亲属只取名；同一角色的简称沿用全名中的译法。
"{dwarf_given}" = "{dwarf_given}"
"{elf_given}" = "{elf_given}"
"{human_given}" = "{human_given}"
"{goblin_given}" = "{goblin_given}"
"{kobold_given}" = "{kobold_given}"

