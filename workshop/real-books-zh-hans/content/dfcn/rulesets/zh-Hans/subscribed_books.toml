[[rulesets]]
name = "chronicle"
[rulesets.rules]
"Let it be known to all who read these pages: this is the chronicle of {@bt_site|::subscribed_books::vocabulary::place}, {adj} stronghold of {@bt_entity|::subscribed_books::vocabulary::entity}." = "愿所有读到此书的人知晓：这是 {@bt_site|::subscribed_books::vocabulary::place} 的编年史，它是 {@bt_entity|::subscribed_books::vocabulary::entity} 的{adj}堡垒。"
"Here are recorded the triumphs that forged a people." = "书中记载了铸就一个民族的胜利。"
"In the {adj} halls of {@bt_site|::subscribed_books::vocabulary::place}, glory was born." = "在 {@bt_site|::subscribed_books::vocabulary::place} {adj}厅堂中，荣耀由此诞生。"
"This chronicle preserves the deeds of {@bt_entity|::subscribed_books::vocabulary::entity}, that none may forget what was achieved." = "这部编年史保存了 {@bt_entity|::subscribed_books::vocabulary::entity} 的功业，使人们永不忘记他们的成就。"
"From the first stone laid to the {adj} heights of its greatest days, {@bt_site|::subscribed_books::vocabulary::place} stands as testament to {@bt_entity|::subscribed_books::vocabulary::entity}." = "从奠下第一块石头，到登上最盛岁月的{adj}巅峰，{@bt_site|::subscribed_books::vocabulary::place} 一直见证着 {@bt_entity|::subscribed_books::vocabulary::entity} 的伟业。"
"This is their story." = "这是他们的故事。"
"There are places in this world where the very stones sing of valor." = "世上有些地方，就连石头也在歌颂勇武。"
"{@bt_site|::subscribed_books::vocabulary::place} is such a place, and {@bt_entity|::subscribed_books::vocabulary::entity} its chorus." = "{@bt_site|::subscribed_books::vocabulary::place} 便是这样的地方，{@bt_entity|::subscribed_books::vocabulary::entity} 则是它的合唱。"
"What follows is the record of their ascent." = "下文记载着他们的崛起。"
"History, that {adj} river, carries the deeds of {@bt_entity|::subscribed_books::vocabulary::entity} forward from the founding of {@bt_site|::subscribed_books::vocabulary::place} into eternity." = "历史，这条{adj}长河，自 {@bt_site|::subscribed_books::vocabulary::place} 建立之日起，便把 {@bt_entity|::subscribed_books::vocabulary::entity} 的功业送往永恒。"
"I set down now the chronicle of their glory, that the current may never still." = "我如今写下他们荣耀的编年史，愿这股流水永不停息。"
"In the year {@year}, {@bt_site|::subscribed_books::vocabulary::place} entered a new age of purpose." = "{@year} 年，{@bt_site|::subscribed_books::vocabulary::place} 迈入了一个有着新目标的时代。"
"The annals turn now to the year {@year}, when greatness stirred once more in {@bt_site|::subscribed_books::vocabulary::place}." = "编年史翻到了 {@year} 年，伟业再次在 {@bt_site|::subscribed_books::vocabulary::place} 萌动。"
"Chapter the next: the year {@year} brought fresh trials and triumphs to {@bt_entity|::subscribed_books::vocabulary::entity}." = "下一章：{@year} 年为 {@bt_entity|::subscribed_books::vocabulary::entity} 带来了新的考验与胜利。"
