"{@bt_entity|::subscribed_books::vocabulary::entity} needed a new home, and by the gods, they made one." = "{@bt_entity|::subscribed_books::vocabulary::entity} 需要一个新家园，诸神在上，他们真的造出来了。"
"In {@year}, our people -- {@bt_entity|::subscribed_books::vocabulary::entity} -- they raised {@bt_site|::subscribed_books::vocabulary::place} from nothing." = "{@year} 年，我们的民族——{@bt_entity|::subscribed_books::vocabulary::entity}——从无到有建起了 {@bt_site|::subscribed_books::vocabulary::place}。"
"Just bare rock and stubborn will." = "靠的只是裸露的岩石和顽强的意志。"
# 明确人物、制品和年份边界，不能把 What I made of it 后的数句吞作制品或年份。
"{::subscribed_books::essay_vocabulary::actor} made {recorded_artifact} that year, {::subscribed_books::vocabulary::year}." = "{::subscribed_books::essay_vocabulary::actor}在那年，也就是{::subscribed_books::vocabulary::year}年，制作了{recorded_artifact}。"
"A {adj} piece of work, everyone agreed." = "所有人都同意，这是一件{adj}作品。"
"You should have seen {@bt_artifact|::subscribed_books::vocabulary::artifact}!" = "你真该看看 {@bt_artifact|::subscribed_books::vocabulary::artifact}！"
"{@bt_hero|::subscribed_books::vocabulary::person} crafted it in {@year}, and folk came from far away just to look upon it." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年制成了它，人们远道而来，只为看上一眼。"
"That was when {@bt_hero|::subscribed_books::vocabulary::person} became {role}." = "{@bt_hero|::subscribed_books::vocabulary::person} 正是在那时成为了 {role}。"
"A good choice, most said." = "大多数人说，这是一个好选择。"
"The people nodded and said it was fitting." = "人们点头，说这很合适。"
"Other things happened in {@year} too, but the details have grown fuzzy with time." = "{@year} 年还发生了其他事情，但细节已经随着时间变得模糊。"
"The year {@year} brought more changes, as years do." = "{@year} 年如每个年头一样，带来了更多变化。"
"The elders remember, even if the specifics have faded." = "即使细节已经淡去，长者们仍然记得。"
"And that is how the elders tell it." = "长者们就是这样讲述的。"
"Whether every word is true, who can say?" = "是不是每句话都属实，谁又说得清呢？"
"So that part of the story ends." = "故事的这一部分到此结束。"
"But there is more to tell." = "但还有更多故事要讲。"
"The old tales are never neat, never tidy." = "古老的传说从来都不整齐，也不周全。"
"And that is the story of {@bt_site|::subscribed_books::vocabulary::place}, as the people tell it." = "这就是人们讲述的 {@bt_site|::subscribed_books::vocabulary::place} 的故事。"
"May it be told again, and again, until the stones themselves crumble." = "愿这个故事一遍又一遍地传下去，直到石头自身也化为尘埃。"
"So ends the tale." = "故事到此结束。"
"Remember it, and tell it to your children." = "记住它，再讲给你们的孩子听。"
"The story of {@bt_site|::subscribed_books::vocabulary::place} lives not in these pages, but in the mouths of those who loved it." = "{@bt_site|::subscribed_books::vocabulary::place} 的故事活在爱它的人们口中，而不只在这些书页里。"
"Tell it again." = "再讲一遍吧。"
"Tell it true." = "如实讲述吧。"
"Tell it always." = "永远传讲下去吧。"
"In the age before ages, when the gods still walked the earth, there arose a place called {@bt_site|::subscribed_books::vocabulary::place}." = "在时代之前的时代，诸神仍行走于大地之时，一个名叫 {@bt_site|::subscribed_books::vocabulary::place} 的地方兴起了。"
"And {@bt_entity|::subscribed_books::vocabulary::entity} was its name and its people." = "而 {@bt_entity|::subscribed_books::vocabulary::entity} 既是它的名字，也是它的人民。"
"This is the sacred chronicle of {@bt_site|::subscribed_books::vocabulary::place}, spoken of in prophecy, wrought by the hands of {@bt_entity|::subscribed_books::vocabulary::entity} at the command of the divine." = "这是预言中提及的 {@bt_site|::subscribed_books::vocabulary::place} 的神圣编年史，它由 {@bt_entity|::subscribed_books::vocabulary::entity} 奉诸神之命亲手缔造。"
"Before the sun had learned its course, {@bt_site|::subscribed_books::vocabulary::place} was dreamed into being." = "在太阳尚未知晓自己的轨道之前，{@bt_site|::subscribed_books::vocabulary::place} 已从梦中诞生。"
"{@bt_entity|::subscribed_books::vocabulary::entity} was the instrument; the gods, the architects." = "{@bt_entity|::subscribed_books::vocabulary::entity} 是工具，诸神则是建筑师。"
"And it came to pass in the year {@year} that the fates turned their attention once more to {@bt_site|::subscribed_books::vocabulary::place}." = "{@year} 年，命运再次把目光投向 {@bt_site|::subscribed_books::vocabulary::place}。"
"The celestial wheel turned to the year {@year}, and the gods moved their pieces upon the board of {@bt_site|::subscribed_books::vocabulary::place}." = "天体之轮转到 {@year} 年，诸神在 {@bt_site|::subscribed_books::vocabulary::place} 这张棋盘上移动了棋子。"
"Prophecy had foretold what would come in {@year}." = "预言早已揭示了 {@year} 年将发生的事。"
"None believed." = "无人相信。"
"All were proven wrong." = "最后证明，所有人都错了。"
"In {@year}, the veil between the mortal and the divine grew thin above {@bt_site|::subscribed_books::vocabulary::place}." = "{@year} 年，{@bt_site|::subscribed_books::vocabulary::place} 上方分隔凡间与神界的帷幕变得稀薄。"
"What transpired was not merely history, but revelation." = "发生的不只是历史，更是神谕的显现。"
"In {@year}, {person} was claimed by {cause}." = "{@year} 年，{person} 被 {cause} 夺去了生命。"
"The gods wept, and the earth shook at {pos} passing." = "{pos}离去使诸神落泪，使大地震颤。"
"{@bt_hero|::subscribed_books::vocabulary::person} ascended from the mortal realm in {@year}, taken by {cause}." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年离开凡间，死因为 {cause}。"
"It is said the stars dimmed that night." = "传说那一晚，星光也黯淡了。"
"The death of {@bt_hero|::subscribed_books::vocabulary::person} in {@year} was no mere ending." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，绝不只是一个终点。"
"{@bt_site|::subscribed_books::vocabulary::place} became holy ground." = "{@bt_site|::subscribed_books::vocabulary::place} 成为了圣地。"
"It was a place of power from its first breath." = "从诞生的第一刻起，这就是一处蕴含力量的地方。"
"{@bt_site|::subscribed_books::vocabulary::place} was not merely founded in {@year}." = "{@bt_site|::subscribed_books::vocabulary::place} 在 {@year} 年不仅仅是被建立。"
"It was summoned, called into being by the collective will of {@bt_entity|::subscribed_books::vocabulary::entity} and the blessing of the divine." = "它是被召唤出来的，是 {@bt_entity|::subscribed_books::vocabulary::entity} 的共同意志与诸神的祝福把它唤入了世间。"
"It was a {adj} vessel of divine purpose." = "它是承载神意的{adj}容器。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} was seized by inspiration beyond mortal reckoning and gave form to {@bt_artifact|::subscribed_books::vocabulary::artifact}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 得到了凡人无法理解的灵感，使 {@bt_artifact|::subscribed_books::vocabulary::artifact} 得以成形。"
"The gods anointed {@bt_hero|::subscribed_books::vocabulary::person} as {role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@year}." = "{@year} 年，诸神册立 {@bt_hero|::subscribed_books::vocabulary::person} 为 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {role}。"
"It was written in the stars before {pro} was born." = "在{pro}出生之前，这一切就已写在群星之中。"
"{person} ascended to {role} in {@year}, fulfilling an ancient prophecy known only to the wise." = "{@year} 年，{person} 升任 {role}，应验了只有智者知晓的古老预言。"
"In the year {@year}, portents appeared above {@bt_site|::subscribed_books::vocabulary::place}, and the wise trembled at their meaning." = "{@year} 年，{@bt_site|::subscribed_books::vocabulary::place} 的天空出现了征兆，智者因其含义而战栗。"
"The year {@year} was marked by signs and wonders that the scholars of {@bt_entity|::subscribed_books::vocabulary::entity} struggled to interpret." = "{@year} 年充满了异象与奇迹，{@bt_entity|::subscribed_books::vocabulary::entity} 的学者们竭力解释，却难以理解。"
"And thus another age passed into legend." = "于是，又一个时代化为了传说。"
"The chronicle moves on, but the echoes of what transpired linger in the {adj} fabric of the world." = "编年史继续向前，往事的回响却仍萦绕在世界{adj}织锦之中。"
"This is the sacred chronicle of {@bt_site|::subscribed_books::vocabulary::place}." = "这是 {@bt_site|::subscribed_books::vocabulary::place} 的神圣编年史。"
"It has no ending, for {@bt_entity|::subscribed_books::vocabulary::entity} is eternal." = "它没有结尾，因为 {@bt_entity|::subscribed_books::vocabulary::entity} 永恒长存。"
"The chronicle of {@bt_site|::subscribed_books::vocabulary::place} returns now to the silence from which it came." = "{@bt_site|::subscribed_books::vocabulary::place} 的编年史如今回到了它诞生时的沉寂。"
"But the gods remember." = "但诸神记得。"
"The full account exists only in the mind of the divine, where all chronicles begin and none ever end." = "完整的记述只存在于神灵的心中，所有编年史在那里开始，却永远不会结束。"

[[rulesets]]
name = "biography"
[rulesets.rules]
"This is the tale of {person}, whose deeds shook the foundations of the world." = "这是 {person} 的故事，其功业撼动了世界的根基。"
"Born in {birth_year} to the {race} people, {pro} was destined for greatness." = "{pro}于 {birth_year} 出生在 {race} 族中，注定要成就伟业。"
"Sing, O muse, of {person}, {race} of {@bt_entity|::subscribed_books::vocabulary::entity}, whose name became legend." = "歌唱吧，缪斯，歌唱 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {race} {person}，那化为传奇的名字。"
"{pro} entered the world in {birth_year}, and the world was never the same." = "{pro}于 {birth_year} 降临世间，从此世界再不一样。"
"In {birth_year}, a {race} child was born who would come to be known as {person}." = "{birth_year}，一个 {race} 孩子诞生了，后来人们称之为 {person}。"
"This is the story of {pos} {adj} journey." = "这是{pos}{adj}旅途的故事。"
"There are heroes whose names are whispered in the dark, whose deeds outstrip the capacity of song to contain them." = "有些英雄的名字在黑暗中被低声念诵，其功业远超歌谣所能承载。"
"{person} was such a one." = "{person} 正是这样的人。"
"And in the year {@year}, {@bt_hero|::subscribed_books::vocabulary::person} faced a new trial." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 面临了新的考验。"
"The next chapter of {@bt_hero|::subscribed_books::vocabulary::person}'s saga begins in {@year}." = "{@bt_hero|::subscribed_books::vocabulary::person} 传奇的下一章从 {@year} 年开始。"
"Fate was not finished with {@bt_hero|::subscribed_books::vocabulary::person}." = "命运还没有结束对 {@bt_hero|::subscribed_books::vocabulary::person} 的考验。"
"The year {@year} brought new challenges." = "{@year} 年带来了新的挑战。"
"By {@year}, {person} had already accomplished what lesser souls would consider a lifetime's work." = "到 {@year} 年，{person} 已完成了常人一生也未必能完成的事业。"
"But the {adj} road stretched on." = "但那条{adj}道路仍在延伸。"
"In {@year}, the unthinkable occurred." = "{@year} 年，不可想象的事情发生了。"
"{@bt_hero|::subscribed_books::vocabulary::person} fell to {cause} in {@bt_site|::subscribed_books::vocabulary::place}." = "{@bt_hero|::subscribed_books::vocabulary::person} 在 {@bt_site|::subscribed_books::vocabulary::place} 死于 {cause}。"
"Even the greatest must fall." = "即使最伟大的人，也终会倒下。"
"{person} met {pos} end in {@year}, struck down by {cause}." = "{@year} 年，{person} 走到了生命的终点，死因为 {cause}。"
"{pos} enemies rejoiced." = "{pos}敌人欢欣鼓舞。"
"History proved them fools." = "历史证明，他们不过是愚人。"
"The year {@year} claimed what no enemy had managed: the life of {person}." = "{@year} 年夺走了任何敌人都未能夺走之物：{person} 的生命。"
"{@bt_hero|::subscribed_books::vocabulary::person} forged {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year}, a {adj} monument to {pos} skill and vision." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 锻造了 {@bt_artifact|::subscribed_books::vocabulary::artifact}，这是见证{pos}技艺与远见的{adj}丰碑。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} created {@bt_artifact|::subscribed_books::vocabulary::artifact}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 创造了 {@bt_artifact|::subscribed_books::vocabulary::artifact}。"
"It was as though {pro} had reached into the world's marrow and drawn forth something eternal." = "仿佛{pro}探入了世界的骨髓，从中取出了某种永恒之物。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} was named {role} of {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 被任命为 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {role}。"
"The mantle sat well upon {pos} {adj} shoulders." = "这份责任与{pos}{adj}肩膀十分相称。"
"{@bt_hero|::subscribed_books::vocabulary::person} rose to {role} in {@year}, a recognition that surprised no one who knew {obj}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 升任 {role}，所有认识{obj}的人都毫不意外。"
"Even heroes must rest, and even rest is a kind of journey." = "英雄也需要休息，而休息也可以是一段旅程。"
"A new chapter awaited." = "新的篇章正等待着。"
"The year {@year} brought further adventures to {@bt_hero|::subscribed_books::vocabulary::person}, each one adding to the {adj} legend." = "{@year} 年为 {@bt_hero|::subscribed_books::vocabulary::person} 带来了更多冒险，每次冒险都让这段{adj}传奇更加丰富。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} continued to shape the world around {obj}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 继续塑造着{obj}身边的世界。"
"And so {@bt_hero|::subscribed_books::vocabulary::person} pressed onward, as heroes must." = "于是，{@bt_hero|::subscribed_books::vocabulary::person} 如英雄应当做的那样，继续前进。"
"Another chapter of the saga concludes, but the hero's journey was far from over." = "传奇的又一章结束了，但英雄的旅程远未终结。"
"{person} had weathered another storm." = "{person} 又挺过了一场风暴。"
"The {adj} road ahead was uncertain, but {pro} walked it without hesitation." = "前方{adj}道路变幻莫测，但{pro}毫不犹豫地走了下去。"
"Such was the life of {person}." = "这便是 {person} 的一生。"
"Let {pos} name be remembered with honor." = "愿{pos}名字被人们怀着敬意铭记。"
"The epic of {@bt_hero|::subscribed_books::vocabulary::person} concludes here, but legends never truly end." = "{@bt_hero|::subscribed_books::vocabulary::person} 的史诗在此结束，但传奇永不真正终结。"
"And so the saga of {person} draws to its close." = "{person} 的传奇就此落幕。"
"This is the life of {@bt_hero|::subscribed_books::vocabulary::person}, who had everything and lost it all." = "这是 {@bt_hero|::subscribed_books::vocabulary::person} 的一生，曾拥有一切，却又失去了一切。"
"There is no comfort in this story." = "这个故事中没有安慰。"
"They will tell you {person} was great." = "人们会告诉你，{person} 是伟大的。"
"They are not wrong." = "他们没有说错。"
"But greatness is no shield against fate." = "但伟大无法抵挡命运。"
"Every tragedy requires a hero worthy of pity." = "每场悲剧都需要一位值得怜悯的主人公。"
"This is the account of how both conspired to destroy {obj}." = "这份记录讲述了两者如何共同毁掉了{obj}。"
"In {@year}, the cracks began to show." = "{@year} 年，裂缝开始显现。"
"The year {@year} brought {@bt_hero|::subscribed_books::vocabulary::person} closer to the edge {pro} could not see." = "{@year} 年让 {@bt_hero|::subscribed_books::vocabulary::person} 更接近那道{pro}看不见的悬崖。"
"What happened in {@year} was, in hindsight, inevitable." = "回头来看，{@year} 年发生的事情是不可避免的。"
"By {@year}, those who loved {@bt_hero|::subscribed_books::vocabulary::person} most could already see the shadow lengthening." = "到 {@year} 年，最爱 {@bt_hero|::subscribed_books::vocabulary::person} 的人已经看见阴影在不断延长。"
"But love is blind, and {@bt_hero|::subscribed_books::vocabulary::person} was deaf to warning." = "但爱是盲目的，而 {@bt_hero|::subscribed_books::vocabulary::person} 对警告充耳不闻。"
"{@bt_hero|::subscribed_books::vocabulary::person} died in {@year}." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年死去。"
"There is nothing more to say." = "再没有什么可说的了。"
"In {@year}, {cause} claimed {@bt_hero|::subscribed_books::vocabulary::person} at {@bt_site|::subscribed_books::vocabulary::place}." = "{@year} 年，{cause} 在 {@bt_site|::subscribed_books::vocabulary::place} 夺去了 {@bt_hero|::subscribed_books::vocabulary::person} 的生命。"
"The world barely noticed." = "世界几乎没有注意到。"
"That is the cruelest part." = "这才是最残酷的部分。"
"{pos} final words, if there were any, are lost." = "即使曾留下遗言，{pos}遗言也已经失落了。"
"The {adj} silence after a tragedy is always the loudest sound." = "悲剧之后{adj}寂静，永远是最响亮的声音。"
"It was {pos} finest work, and the world would repay {obj} with cruelty." = "那是{pos}最杰出的作品，世界却将以残酷回报{obj}。"
"The creation of {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year} was a bright moment in a {adj} story that had precious few." = "{@year} 年 {@bt_artifact|::subscribed_books::vocabulary::artifact} 的诞生，是这个{adj}故事中少有的明亮时刻。"
"The honor became {pos} prison." = "荣誉成了{pos}牢笼。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} accepted the position of {role}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 接受了 {role} 一职。"
"It was the beginning of the end." = "这便是终结的开始。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} stumbled onward through a world that owed {obj} nothing." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 在这个并不亏欠{obj}的世界中踉跄前行。"
"The year {@year} passed." = "{@year} 年过去了。"
"{@bt_hero|::subscribed_books::vocabulary::person} endured." = "{@bt_hero|::subscribed_books::vocabulary::person} 挺了过来。"
"Endurance is not the same as living." = "忍受与活着，并不是一回事。"
"And so it continued." = "事情就这样继续着。"
"The tragedy does not hurry." = "悲剧从不着急。"
"The next act awaited, as tragedies always have a next act." = "下一幕正等待上演，悲剧总有下一幕。"
"Until they don't." = "直到再也没有。"
"The curtain did not fall -- not yet." = "幕布还没有落下——至少此刻没有。"
"But the audience, if there had been one, would have already known how this story ends." = "但如果有观众，他们早已知道这个故事会如何结束。"
"This is the life of {person}." = "这便是 {person} 的一生。"
"Read it and remember that greatness guarantees nothing." = "读完它，记住伟大并不保证任何事。"
"The tragedy of {@bt_hero|::subscribed_books::vocabulary::person} is complete." = "{@bt_hero|::subscribed_books::vocabulary::person} 的悲剧已经结束。"
"The moral, if there is one, is that there is no moral." = "如果这其中有寓意，那便是它没有寓意。"
"Pity {obj}, if you will." = "如果愿意，就怜悯{obj}吧。"
"But do not pretend you would have done differently." = "但不要假装自己会做得不同。"
"Blessed be the memory of {person}, whose life was a light unto the people of {@bt_entity|::subscribed_books::vocabulary::entity}." = "愿 {person} 的记忆得到祝福，其一生曾为 {@bt_entity|::subscribed_books::vocabulary::entity} 的人民带来光明。"
"This biography honors {@bt_hero|::subscribed_books::vocabulary::person}, {race} of {@bt_entity|::subscribed_books::vocabulary::entity}, whose {adj} virtue guided all who knew {obj}." = "这部传记纪念 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {race} {@bt_hero|::subscribed_books::vocabulary::person}，其{adj}美德曾指引所有认识{obj}的人。"
"In {birth_year}, the world was graced with {@bt_hero|::subscribed_books::vocabulary::person}, and from that day forward, {@bt_entity|::subscribed_books::vocabulary::entity} was blessed." = "{birth_year}，{@bt_hero|::subscribed_books::vocabulary::person} 降临世间；从那天起，{@bt_entity|::subscribed_books::vocabulary::entity} 便得到祝福。"
"The saints of this world are not always recognized in their lifetimes." = "这个世界的圣者并不总能在生前得到认可。"
"This account preserves {pos} deeds for the edification of future generations." = "这份记述保存{pos}事迹，以启迪后世。"
"In the year {@year}, {@bt_hero|::subscribed_books::vocabulary::person} demonstrated once more the depth of {pos} virtue." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 再次展现了{pos}深厚美德。"
"{@bt_hero|::subscribed_books::vocabulary::person}'s story continues in {@year}, with another testament to {pos} {adj} character." = "{@bt_hero|::subscribed_books::vocabulary::person} 的故事延续到 {@year} 年，又一次证明了{pos}{adj}品格。"
"{person} departed this world in {@year}, taken by {cause}." = "{person} 于 {@year} 年离开了这个世界，死因为 {cause}。"
"{pos} passing was mourned by all of {@bt_entity|::subscribed_books::vocabulary::entity}, for they had lost a guiding light." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的所有人都为{pos}离去哀悼，因为他们失去了一盏指路明灯。"
"But the {adj} deeds of {pos} life ensured that {pos2} spirit would endure forever." = "但{pos}一生{adj}事迹，使{pos2}精神永远长存。"
"{@bt_hero|::subscribed_books::vocabulary::person} created {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year}, a gift to the world that reflected {pos} {adj} generosity of spirit." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 创造了 {@bt_artifact|::subscribed_books::vocabulary::artifact}，送给世界的这份礼物展现了{pos}{adj}慷慨精神。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} humbly accepted the role of {role} within {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 谦逊地接受了 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {role} 一职。"
"{pro} served not for glory, but for the good of all." = "{pro}服务众人是为了所有人的福祉，而不是为了荣耀。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} continued to serve {@bt_entity|::subscribed_books::vocabulary::entity} with quiet devotion and {adj} grace." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 继续以默默的奉献和{adj}风范服务 {@bt_entity|::subscribed_books::vocabulary::entity}。"
"{@bt_hero|::subscribed_books::vocabulary::person}'s example shone ever brighter with each passing year." = "{@bt_hero|::subscribed_books::vocabulary::person} 的榜样光芒逐年更加明亮。"
"And so {@bt_hero|::subscribed_books::vocabulary::person} continued, a beacon of {adj} virtue in a world much in need of light." = "{@bt_hero|::subscribed_books::vocabulary::person} 就这样继续前行，在亟需光明的世界中，成为一座{adj}美德的灯塔。"
"May the memory of {person} inspire all who read these words." = "愿 {person} 的记忆鼓舞所有读到这些文字的人。"
"{pos} life was a gift." = "{pos}一生是一份馈赠。"
"This account of {@bt_hero|::subscribed_books::vocabulary::person}'s life concludes, but {pos} light endures wherever goodness is valued." = "{@bt_hero|::subscribed_books::vocabulary::person} 的生平记述在此结束，但只要善仍受到珍视，{pos}光芒便一直长存。"
"May we all aspire to such a life." = "愿我们都以这样的一生为志向。"
"The truth about {@bt_hero|::subscribed_books::vocabulary::person} is more complicated than the legends suggest." = "{@bt_hero|::subscribed_books::vocabulary::person} 的真实人生比传说更加复杂。"
"This biography attempts an honest account." = "这部传记试图如实记述。"
"{@bt_hero|::subscribed_books::vocabulary::person} was neither saint nor monster, but a {race} of {@bt_entity|::subscribed_books::vocabulary::entity} who lived a {adj} life in complicated times." = "{@bt_hero|::subscribed_books::vocabulary::person} 是在复杂时代过着{adj}人生的 {@bt_entity|::subscribed_books::vocabulary::entity} {race}，既不是圣者，也不是怪物。"
"Everyone has an opinion about {person}." = "每个人都对 {person} 有自己的看法。"
"Most of them are wrong." = "其中大多数是错的。"
"Here are the facts, such as they are." = "事实如下，至少是我们所能掌握的事实。"
"Honesty is a poor companion for biography." = "诚实并不是传记的好伙伴。"
"It makes heroes smaller and villains more sympathetic." = "它让英雄显得渺小，也让恶徒显得可怜。"
"Nevertheless, this account of {person} pursues truth over comfort." = "尽管如此，这份关于 {person} 的记录仍将真实置于安慰之上。"
"The {adj} record demands no less." = "这份{adj}记录要求的正是如此。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} did what {pro} usually did: something nobody quite expected." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 做了{pro}惯常做的事：一些谁都没能料到的事情。"
"The year {@year} found {@bt_hero|::subscribed_books::vocabulary::person} in characteristically {adj} form." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 表现出了一贯{adj}样子。"
"What happened in {@year} reveals both the best and worst of {@bt_hero|::subscribed_books::vocabulary::person}." = "{@year} 年发生的事情，同时展现了 {@bt_hero|::subscribed_books::vocabulary::person} 最好和最坏的一面。"
"{@bt_hero|::subscribed_books::vocabulary::person} died in {@year} by {cause}." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年死于 {cause}。"
"{@bt_site|::subscribed_books::vocabulary::place} remembers." = "{@bt_site|::subscribed_books::vocabulary::place} 仍记得。"
"It was {adj} work." = "这是一件{adj}作品。"
"Nobody could deny that, whatever they thought of the maker." = "无论人们如何评价创作者，这一点都无法否认。"
"{@bt_hero|::subscribed_books::vocabulary::person} became {role} in {@year}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 成为了 {role}。"
"Some said it was deserved." = "有人说，这是实至名归。"
"Others disagreed." = "另一些人不同意。"
"Both sides had points." = "双方都有自己的道理。"
"Make of it what you will." = "如何理解，由你决定。"
"{@bt_hero|::subscribed_books::vocabulary::person} certainly did." = "{@bt_hero|::subscribed_books::vocabulary::person} 肯定也这样做了。"
"The honest account continues." = "如实的记述仍在继续。"
"Uncomfortable truths and all." = "包括所有令人不快的真相。"
"This is {@bt_hero|::subscribed_books::vocabulary::person} as {pro} actually was." = "这便是真正的 {@bt_hero|::subscribed_books::vocabulary::person}。"
"Not the legend." = "不是传说中的样子。"
"Not the villain." = "也不是恶徒的样子。"
"Just a {race} who lived." = "只是一个曾经活过的 {race}。"
"The biography of {person} is complete." = "{person} 的传记已经写完。"
"Judge {obj} if you must, but judge honestly." = "如果一定要评判{obj}，请公正地评判。"
"I have tried to write the truth about {person}." = "我试着写下了 {person} 的真实人生。"
"The {adj} truth is never simple, never clean, and never finished." = "{adj}真相从来不简单、不纯粹，也永远没有终点。"
"But it is all we have." = "但它是我们所拥有的一切。"
"{pos} deeds were such that the bards never tired of singing them." = "{pos}功业让吟游诗人百唱不厌。"
"Listen!" = "听啊！"
"This is the legend of {@bt_hero|::subscribed_books::vocabulary::person}, mightiest of {@bt_entity|::subscribed_books::vocabulary::entity}, whose name alone could still a battlefield." = "这是 {@bt_entity|::subscribed_books::vocabulary::entity} 最强大之人 {@bt_hero|::subscribed_books::vocabulary::person} 的传奇，仅凭名字便能让战场沉寂。"
"They say {@bt_hero|::subscribed_books::vocabulary::person} was born during a storm in {birth_year}, and that lightning split the sky in greeting." = "人们说，{@bt_hero|::subscribed_books::vocabulary::person} 于 {birth_year} 诞生在一场风暴中，闪电劈开天空，迎接这次降生。"
"Whether true or not, the legend begins there." = "无论真假，传奇都从那里开始。"
"Legends are not made." = "传奇无法凭空创造。"
"They are earned, one {adj} deed at a time, until the weight of accumulated glory bends the line between history and myth." = "传奇靠一次次{adj}功业赢得，直到累积的荣耀重得足以弯曲历史与神话之间的界线。"
"{person} earned {pos} legend a hundred times over." = "{person} 已经成百次地赢得了{pos}传奇。"
"And in {@year}, the legend grew." = "{@year} 年，传奇继续成长。"
"The year {@year} added another verse to the song of {@bt_hero|::subscribed_books::vocabulary::person}." = "{@year} 年为 {@bt_hero|::subscribed_books::vocabulary::person} 的歌谣增添了新的诗节。"
"What happened next, in {@year}, stretched belief to its breaking point." = "随后在 {@year} 年发生的事，让人难以置信到了极点。"
"{@bt_hero|::subscribed_books::vocabulary::person} fell in {@year}." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年陨落。"
"In {@year}, {person} passed from the world." = "{@year} 年，{person} 离开了人世。"
"The legends say it glowed in {pos} hands as {pro} worked." = "传说当{pro}制作它时，它在{pos}手中发出光芒。"
"When {@bt_hero|::subscribed_books::vocabulary::person} was named {role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@year}, the very stones of {@bt_site|::subscribed_books::vocabulary::place} are said to have trembled." = "据说在 {@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 被任命为 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {role} 时，就连 {@bt_site|::subscribed_books::vocabulary::place} 的石头也为之震颤。"
"In {@year}, {@bt_hero|::subscribed_books::vocabulary::person} did something impossible." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 完成了一件不可能之事。"
"Again." = "又一次。"
"And the legend grew, as legends do -- each telling a little more {adj} than the last." = "传奇如所有传奇一样继续成长——每讲一遍，就比上一遍更加{adj}。"
"The bards added another verse." = "吟游诗人又添了一段诗。"
"The truth grew dimmer." = "真相更加模糊。"
"The story grew brighter." = "故事更加耀眼。"
"This is the legend of {person}." = "这便是 {person} 的传奇。"
"It is, perhaps, more true than the truth." = "也许，它比真相更真实。"
"The legend ends." = "传奇结束了。"
"But somewhere, in a hall lit by firelight, someone is already telling it again." = "但在某处，一座被炉火照亮的厅堂中，有人已经开始再次讲述。"
"The legend of {person} cannot be contained by pages." = "{person} 的传奇无法被书页容纳。"

[[rulesets]]
name = "autobiography"
[rulesets.rules]
"I write this not for glory, but because the truth demands it." = "我写下这些，并非为了荣耀，而是真相要求我这样做。"
"My name is {@bt_hero|::subscribed_books::vocabulary::person}, and I have done things I cannot undo." = "我的名字是 {@bt_hero|::subscribed_books::vocabulary::person}，我做过一些无法挽回的事。"
"These are my confessions." = "这是我的自白。"
"I am {@bt_hero|::subscribed_books::vocabulary::person}, {race} of {@bt_entity|::subscribed_books::vocabulary::entity}, and I am not the person you think I am." = "我是 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {race} {@bt_hero|::subscribed_books::vocabulary::person}，我并不是你以为的那个人。"
"I do not expect forgiveness." = "我不指望得到宽恕。"
"I only ask that you read, and understand." = "我只希望你读完，并且理解。"
"I am {@bt_hero|::subscribed_books::vocabulary::person}." = "我是 {@bt_hero|::subscribed_books::vocabulary::person}。"
"The weight of memory is a {adj} burden, heavier than stone, sharper than any blade." = "记忆的重量是一种{adj}负担，比石头更沉，比任何刀刃更锐利。"
"I am {person}, and I carry it all." = "我是 {person}，我背负着这一切。"
"This account is my attempt to set it down, if only for a moment." = "我写下这份记述，是想把它放下来，哪怕只是片刻。"
"In {@year}, I did something I still think about." = "{@year} 年，我做了一件至今仍时常想起的事。"
"The year {@year} haunts me still." = "{@year} 年至今仍纠缠着我。"
"I come now to {@year}." = "现在写到 {@year} 年了。"
"I have put off writing this part." = "我一直拖延着，不愿写这一部分。"
"I was there when {@bt_target|::subscribed_books::vocabulary::person} died in {@year}." = "{@bt_target|::subscribed_books::vocabulary::person} 于 {@year} 年死去时，我就在场。"
"I could have done more." = "我本可以做得更多。"
"The death of {@bt_target|::subscribed_books::vocabulary::person} in {@year} -- by {cause} -- it was my fault." = "{@bt_target|::subscribed_books::vocabulary::person} 于 {@year} 年死于 {cause}——这是我的错。"
"Or it wasn't." = "也许并不是。"
"I still don't know." = "我至今仍不知道。"
"I made {recorded_artifact} in {::subscribed_books::vocabulary::year}." = "我于{::subscribed_books::vocabulary::year}年制作了{recorded_artifact}。"
"People praised it." = "人们赞美它。"
"I felt nothing." = "我却毫无感觉。"
"They made me {role} in {@year}." = "{@year} 年，他们任命我为 {role}。"
"I did not deserve it." = "我并不配得上这个职位。"
"In {@year}, I continued to live, which is not the same as being alive." = "{@year} 年，我继续过着日子，但那和真正活着并不相同。"
"I wish I could say I learned from it." = "我希望自己能说，我从中学到了什么。"
"Perhaps I did, in time." = "也许，后来我确实学到了。"
"This is my life as I lived it." = "这便是我真正经历过的人生。"
"Not as I wished I had." = "不是我希望自己拥有的人生。"
"I was {adj}." = "我曾是{adj}。"
"I was flawed." = "我有缺陷。"
"I was real." = "我也真实存在。"
"I set down my pen now, and with it, perhaps, some small fraction of the {adj} guilt I have carried." = "现在我放下笔，也许也放下了所背负的{adj}罪疚中极小的一部分。"
"If these words reach you, know that I wrote them in truth, if not in wisdom." = "如果这些文字传到了你手中，请知道，即使其中没有智慧，我也怀着真诚写下了它们。"
"I was here." = "我曾在这里。"
"My name is {person}, and this is the story of how I rose above all obstacles." = "我的名字是 {person}，这便是我战胜一切障碍的故事。"
"You're welcome." = "不必客气。"
"I, {@bt_hero|::subscribed_books::vocabulary::person}, {race} of {@bt_entity|::subscribed_books::vocabulary::entity}, have lived a life that lesser beings can only dream of." = "我，{@bt_entity|::subscribed_books::vocabulary::entity} 的 {race} {@bt_hero|::subscribed_books::vocabulary::person}，拥有过常人只能在梦中想象的人生。"
"Allow me to tell you about it." = "请容我向你讲述。"
"From the humblest beginnings, I, {@bt_hero|::subscribed_books::vocabulary::person}, forged a {adj} destiny." = "我，{@bt_hero|::subscribed_books::vocabulary::person}，从最卑微的起点铸就了一个{adj}命运。"
"This is my story, told by the only person qualified to tell it: me." = "这是我的故事，由唯一有资格讲述它的人来讲述：我自己。"
"In {@year}, I achieved yet another {adj} triumph." = "{@year} 年，我又赢得了一场{adj}胜利。"
"The year {@year} was, naturally, another victory for yours truly." = "{@year} 年，自然又是鄙人的一次胜利。"
"Allow me to recount what I accomplished in {@year}." = "请容我回顾自己在 {@year} 年的成就。"
"A lesser soul." = "一个不如我的人。"
"I mourned briefly and moved on." = "我短暂哀悼，随后继续前进。"
"I created {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year}." = "我于 {@year} 年创造了 {@bt_artifact|::subscribed_books::vocabulary::artifact}。"
"It was, as everyone agreed, {adj}." = "所有人都同意，它是{adj}。"
"My finest work." = "我最杰出的作品。"
"Until the next." = "直到下一件作品出现。"
"In {@year}, they finally recognized my worth and named me {role}." = "{@year} 年，他们终于承认了我的价值，任命我为 {role}。"
"About time." = "也该如此了。"
"In {@year}, I did what needed to be done." = "{@year} 年，我做了必须做的事。"
"As always." = "一如既往。"
"Another year, another triumph." = "又一年，又一次胜利。"
"The pattern is obvious." = "这个规律显而易见。"
"And so my story stands as proof: greatness is not given." = "我的故事由此证明：伟大并非他人赐予。"
"It is taken." = "它需要争取。"
"By me." = "由我亲自争取。"
"Remember the name." = "记住这个名字。"
"You will not see its like again." = "你不会再见到与之相似的人。"
"What is a life?" = "人生究竟是什么？"
"I am {@bt_hero|::subscribed_books::vocabulary::person}, and after all I have seen, I still do not know." = "我是 {@bt_hero|::subscribed_books::vocabulary::person}，见识过这一切之后，我仍然不知道。"
"But I will try to find out by writing it down." = "但我会尝试通过书写来寻找答案。"
"I have lived long enough to know that the examined life is the only one worth living." = "我活得够久，已经知道，只有经过反思的人生才值得过。"
"I am {@bt_hero|::subscribed_books::vocabulary::person}, and this is my examination." = "我是 {@bt_hero|::subscribed_books::vocabulary::person}，这便是我的反思。"
"In {@year}, I learned something about the nature of things." = "{@year} 年，我对事物的本质有所领悟。"
"The year {@year} posed a question I had not considered before." = "{@year} 年向我提出了一个从未想过的问题。"
"The death of {@bt_target|::subscribed_books::vocabulary::person} in {@year} taught me that impermanence is the only constant." = "{@bt_target|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡让我懂得，唯有无常才是永恒。"
"When I created {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year}, I understood for the first time that we make things to outlast ourselves." = "当我于 {@year} 年创造 {@bt_artifact|::subscribed_books::vocabulary::artifact} 时，我第一次理解，我们制造东西，是为了让它们比我们长存。"
"Becoming {role} in {@year} made me wonder: do we choose our roles, or do they choose us?" = "{@year} 年成为 {role} 让我思考：是我们选择角色，还是角色选择我们？"
"In {@year}, I lived." = "{@year} 年，我活着。"
"Which is to say, I suffered, and rejoiced, and wondered why." = "也就是说，我痛苦、欢喜，并且追问缘由。"
"Each year is a question." = "每一年都是一个问题。"
"The answers, if they come at all, arrive late." = "即使答案真的到来，也总是姗姗来迟。"
"I have not answered the question." = "我还没有回答这个问题。"
"But I have lived it, and perhaps that is enough." = "但我已经亲身经历了它，也许这就够了。"
"This autobiography is not a map." = "这部自传不是一张地图。"
"It is a {adj} record of one soul's attempt to navigate without one." = "它是一份{adj}记录，记下一个灵魂试图在没有地图时寻找方向的经历。"
"I was lost." = "我曾迷失。"
"I was found." = "我曾找回方向。"
"I was lost again." = "我又一次迷失。"
"Day one." = "第一天。"
"My name is {@bt_hero|::subscribed_books::vocabulary::person}." = "我的名字是 {@bt_hero|::subscribed_books::vocabulary::person}。"
"I am a {race} of {@bt_entity|::subscribed_books::vocabulary::entity}." = "我是 {@bt_entity|::subscribed_books::vocabulary::entity} 的一个 {race}。"
"I am setting out, and I am writing everything down." = "我要出发了，我会把一切都记录下来。"
"{@bt_hero|::subscribed_books::vocabulary::person}, journal entry the first." = "{@bt_hero|::subscribed_books::vocabulary::person}，第一篇日志。"
"Packed my gear." = "收拾好装备。"
"Said my goodbyes." = "道过别了。"
"The road awaits." = "道路正在等我。"
"I am {person}, and what follows is a record of my travels, my fights, and my meals (the last being the most important)." = "我是 {person}，下文记录了我的旅途、战斗和每一顿饭（最后这一项最重要）。"
"New territory." = "新地方。"
"New trouble." = "新麻烦。"
"Still alive." = "还活着。"
"Barely." = "勉强活着。"
"Entry for {@year}: things got interesting." = "{@year} 年记录：事情变得有趣了。"
"{@bt_target|::subscribed_books::vocabulary::person} didn't make it." = "{@bt_target|::subscribed_books::vocabulary::person} 没能挺过来。"
"Damn." = "该死。"
"Made {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year}." = "{@year} 年做出了 {@bt_artifact|::subscribed_books::vocabulary::artifact}。"
"Pretty proud of that one." = "对此颇为自豪。"
"Got promoted to {role} in {@year}." = "{@year} 年被提拔为 {role}。"
"More responsibility." = "责任更多了。"
"Less fun." = "乐趣更少了。"
"Survived." = "活下来了。"
"That's the main thing." = "这是最要紧的。"
"Onward." = "继续前进。"
"End of journal." = "日志结束。"
"If you're reading this, I either made it home or I didn't." = "如果你正在读这些，我要么回到了家，要么没有。"
"Either way, it was a hell of a ride." = "无论如何，这真是一场惊心动魄的旅程。"
"{person}, signing off." = "{person}，就此搁笔。"
"What a life." = "多么丰富的人生。"
"I am old now." = "如今我老了。"
"My name is {@bt_hero|::subscribed_books::vocabulary::person}, and I have lived long enough to see the world change three times over." = "我的名字是 {@bt_hero|::subscribed_books::vocabulary::person}，我活得够久，已经看见世界彻底改变了三次。"
"Let me tell you what I have learned." = "让我告诉你，我学到了什么。"
"When you are young, you think the world belongs to you." = "年轻时，你以为世界属于自己。"
"I am {person}, and I am old enough to know it belongs to no one." = "我是 {person}，我已经老到明白世界不属于任何人。"
"But sit, and I will tell you my story." = "不过，坐下吧，我来讲讲自己的故事。"
"The {adj} years have taught me many things, not least that the young never listen and the old never stop talking." = "{adj}岁月教会了我很多事，尤其是年轻人从不倾听，而老人从不停止说话。"
"I am {@bt_hero|::subscribed_books::vocabulary::person}, and I will now commit both sins at once." = "我是 {@bt_hero|::subscribed_books::vocabulary::person}，现在我要同时犯下这两种罪。"
"This is the story of my life, told for those who come after." = "这是我的一生，讲给后来者听。"
"Ah, {@year}." = "啊，{@year} 年。"
"I remember it well." = "我记得很清楚。"
"Or well enough." = "至少还算清楚。"
"In {@year}, I was younger and more foolish." = "{@year} 年，我更年轻，也更愚蠢。"
"Let me tell you about it." = "让我讲给你听。"
"We lost {@bt_target|::subscribed_books::vocabulary::person} in {@year}." = "{@year} 年，我们失去了 {@bt_target|::subscribed_books::vocabulary::person}。"
"It hurt then." = "那时很痛。"
"It hurts now." = "现在仍然很痛。"
"It seemed important at the time." = "当时觉得它很重要。"
"Perhaps it still is." = "也许如今仍然重要。"
"They named me {role} in {@year}." = "{@year} 年，他们任命我为 {role}。"
"A young person's burden, given to someone who was no longer young." = "这是年轻人的重担，却交给了一个不再年轻的人。"
"In {@year}, life went on." = "{@year} 年，生活继续着。"
"It always does, until it doesn't." = "它总会继续，直到不再继续。"
"But that was then." = "但那都是过去了。"
"The years have a way of smoothing the edges." = "岁月总能磨平棱角。"
"I am old." = "我老了。"
"I am tired." = "我累了。"
"But I regret nothing." = "但我什么都不后悔。"
"Well." = "嗯。"
"Almost nothing." = "几乎什么都不后悔。"
"This is my life, as remembered by an old {race} with a long memory and a {adj} heart." = "这便是我的人生，由一个记忆悠长、心怀{adj}的年老 {race} 回忆而成。"
"Take from it what you will." = "你愿意从中得到什么，就得到什么吧。"
"I leave you now with the {adj} sum of my years." = "如今，我把一生{adj}积淀留给你。"
"I was born." = "我诞生。"
"I lived." = "我活过。"
"I will die." = "我终将死去。"
"Everything in between was the story, and what a story it was." = "两者之间的一切便是故事，那是何等精彩的故事。"

[[rulesets]]
name = "cultural"
[rulesets.rules]
"This is the history of {@bt_entity|::subscribed_books::vocabulary::entity}, a people whose achievements illuminated the world." = "这是 {@bt_entity|::subscribed_books::vocabulary::entity} 的历史，一个以成就照亮世界的民族。"
"From {@bt_site|::subscribed_books::vocabulary::place}, they built an empire of {adj} brilliance." = "他们以 {@bt_site|::subscribed_books::vocabulary::place} 为起点，建立了一个闪耀着{adj}光芒的帝国。"
"The golden age of {@bt_entity|::subscribed_books::vocabulary::entity} is the subject of this work." = "本书的主题是 {@bt_entity|::subscribed_books::vocabulary::entity} 的黄金时代。"
"From their seat at {@bt_site|::subscribed_books::vocabulary::place}, they achieved wonders." = "他们从驻地 {@bt_site|::subscribed_books::vocabulary::place} 出发，创造了诸多奇迹。"
"Civilizations rise and fall, but few burn as brightly as {@bt_entity|::subscribed_books::vocabulary::entity}." = "文明有兴有衰，却很少有文明能像 {@bt_entity|::subscribed_books::vocabulary::entity} 一样闪耀。"
"Rooted in {@bt_site|::subscribed_books::vocabulary::place}, they built a legacy of {adj} achievement that the world has never equaled." = "他们扎根于 {@bt_site|::subscribed_books::vocabulary::place}，留下了世上无可比拟的{adj}成就。"
"This cultural history celebrates their ascent." = "这部文化史颂扬着他们的崛起。"
"In {@year}, {@bt_entity|::subscribed_books::vocabulary::entity} reached new heights." = "{@year} 年，{@bt_entity|::subscribed_books::vocabulary::entity} 达到了新的高度。"
"The year {@year} saw yet another triumph for the people of {@bt_site|::subscribed_books::vocabulary::place}." = "{@year} 年，{@bt_site|::subscribed_books::vocabulary::place} 的人民又赢得了一次胜利。"
"{@bt_hero|::subscribed_books::vocabulary::person} fell in {@year}, a loss to {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年陨落，这对 {@bt_entity|::subscribed_books::vocabulary::entity} 是一大损失。"
"But the culture {pro} served endured." = "但{pro}所服务的文化仍然长存。"
"The founding of {@bt_site|::subscribed_books::vocabulary::place} in {@year} was a {adj} expansion of {@bt_entity|::subscribed_books::vocabulary::entity}'s reach." = "{@year} 年 {@bt_site|::subscribed_books::vocabulary::place} 的建立，是 {@bt_entity|::subscribed_books::vocabulary::entity} 势力的一次{adj}扩张。"
"When {@bt_hero|::subscribed_books::vocabulary::person} created {@bt_artifact|::subscribed_books::vocabulary::artifact} in {@year}, it became a symbol of {@bt_entity|::subscribed_books::vocabulary::entity}'s cultural flowering." = "当 {@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年创造 {@bt_artifact|::subscribed_books::vocabulary::artifact} 时，它成为了 {@bt_entity|::subscribed_books::vocabulary::entity} 文化繁荣的象征。"
"{@bt_hero|::subscribed_books::vocabulary::person} became {role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@year}, a choice that strengthened the nation." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 成为了 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {role}，这一选择壮大了这个国家。"
"In {@year}, the culture of {@bt_entity|::subscribed_books::vocabulary::entity} grew richer still." = "{@year} 年，{@bt_entity|::subscribed_books::vocabulary::entity} 的文化更加丰富。"
"And the golden age continued, each year brighter than the last." = "黄金时代继续着，每一年都比前一年更耀眼。"
"Such was the golden age of {@bt_entity|::subscribed_books::vocabulary::entity}." = "这便是 {@bt_entity|::subscribed_books::vocabulary::entity} 的黄金时代。"
"May its light never be forgotten." = "愿它的光辉永不被遗忘。"
"The cultural history of {@bt_entity|::subscribed_books::vocabulary::entity} is a {adj} testament to what a united people can achieve." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的文化史是{adj}见证，展现了团结的人民能够获得的成就。"
"May those who follow find inspiration in these pages." = "愿后来者从这些书页中得到启发。"
"This is the history of {@bt_entity|::subscribed_books::vocabulary::entity}, and it is a warning." = "这是 {@bt_entity|::subscribed_books::vocabulary::entity} 的历史，也是一则警告。"
"What they built at {@bt_site|::subscribed_books::vocabulary::place} was {adj}." = "他们在 {@bt_site|::subscribed_books::vocabulary::place} 建立的事业是{adj}。"
"What they lost was greater." = "而他们失去的更加伟大。"
"Learn from {@bt_entity|::subscribed_books::vocabulary::entity}." = "从 {@bt_entity|::subscribed_books::vocabulary::entity} 身上吸取教训吧。"
"They had everything." = "他们曾经拥有一切。"
"This is the story of how they squandered it." = "这个故事讲述他们如何挥霍了这一切。"
"In {@year}, the seeds of ruin put down deeper roots." = "{@year} 年，毁灭的种子扎下了更深的根。"
"{@bt_hero|::subscribed_books::vocabulary::person}'s death in {@year} was a blow from which {@bt_entity|::subscribed_books::vocabulary::entity} never recovered." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，给 {@bt_entity|::subscribed_books::vocabulary::entity} 带来了无法恢复的打击。"
"The founding of {@bt_site|::subscribed_books::vocabulary::place} in {@year} overextended {@bt_entity|::subscribed_books::vocabulary::entity}'s resources." = "{@year} 年 {@bt_site|::subscribed_books::vocabulary::place} 的建立，过度消耗了 {@bt_entity|::subscribed_books::vocabulary::entity} 的资源。"
"{@bt_artifact|::subscribed_books::vocabulary::artifact}, created in {@year}, was a {adj} distraction from the real problems." = "{@year} 年创造的 {@bt_artifact|::subscribed_books::vocabulary::artifact} 是一种{adj}消遣，让人们忽视了真正的问题。"
"When {@bt_hero|::subscribed_books::vocabulary::person} became {role} in {@year}, it was a sign of {@bt_entity|::subscribed_books::vocabulary::entity}'s declining judgment." = "{@year} 年 {@bt_hero|::subscribed_books::vocabulary::person} 成为 {role}，标志着 {@bt_entity|::subscribed_books::vocabulary::entity} 判断力的衰退。"
"In {@year}, {@bt_entity|::subscribed_books::vocabulary::entity} continued to ignore the warnings." = "{@year} 年，{@bt_entity|::subscribed_books::vocabulary::entity} 继续无视警告。"
"And still they did not listen." = "但他们依旧没有听进去。"
"This is the cautionary history of {@bt_entity|::subscribed_books::vocabulary::entity}." = "这便是 {@bt_entity|::subscribed_books::vocabulary::entity} 警示世人的历史。"
"Read it, and do not repeat their mistakes." = "读完它，切莫重蹈他们的覆辙。"
"This cultural history examines {@bt_entity|::subscribed_books::vocabulary::entity} in context, measuring their achievements against those of the wider world." = "这部文化史把 {@bt_entity|::subscribed_books::vocabulary::entity} 放进时代背景中考察，将其成就与整个世界相比。"
"How does {@bt_entity|::subscribed_books::vocabulary::entity} compare to its neighbors?" = "{@bt_entity|::subscribed_books::vocabulary::entity} 与其邻国相比如何？"
"This history seeks an honest answer." = "这部历史试图寻找一个诚实的答案。"
"In {@year}, {@bt_entity|::subscribed_books::vocabulary::entity}'s position relative to others shifted." = "{@year} 年，{@bt_entity|::subscribed_books::vocabulary::entity} 相对于其他势力的地位发生了变化。"
"{@bt_hero|::subscribed_books::vocabulary::person}'s death in {@year} weakened {@bt_entity|::subscribed_books::vocabulary::entity} relative to its rivals." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，使 {@bt_entity|::subscribed_books::vocabulary::entity} 在竞争者面前变得弱势。"
"{@bt_site|::subscribed_books::vocabulary::place}, founded in {@year}, gave {@bt_entity|::subscribed_books::vocabulary::entity} strategic advantage." = "{@year} 年建立的 {@bt_site|::subscribed_books::vocabulary::place}，给 {@bt_entity|::subscribed_books::vocabulary::entity} 带来了战略优势。"
"The year {@year} saw {@bt_entity|::subscribed_books::vocabulary::entity} neither rise nor fall, but hold steady." = "{@year} 年，{@bt_entity|::subscribed_books::vocabulary::entity} 既没有兴起，也没有衰落，而是保持稳定。"
"The balance of power is never static." = "力量的均势从来不会静止不变。"
"The comparative history of {@bt_entity|::subscribed_books::vocabulary::entity} reveals a culture shaped as much by its neighbors as by its own ambitions." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的比较史揭示了一种文化，其形态既受自身抱负影响，也同样受到邻国塑造。"
"In the beginning, there was {@bt_entity|::subscribed_books::vocabulary::entity}." = "起初，有了 {@bt_entity|::subscribed_books::vocabulary::entity}。"
"Or so the story goes." = "至少故事是这样讲的。"
"This is the founding myth of a people, told from {@bt_site|::subscribed_books::vocabulary::place}." = "这是从 {@bt_site|::subscribed_books::vocabulary::place} 流传而来的一个民族的起源神话。"
"Before there were records, there were stories." = "在记录出现之前，已经有了故事。"
"The people of {@bt_entity|::subscribed_books::vocabulary::entity} tell this one about how they came to be." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的人民用这个故事讲述自己的起源。"
"Every civilization has a creation story, a {adj} narrative that explains not just where they came from, but why they matter." = "每个文明都有创世故事，这种{adj}叙事既解释他们从何而来，也解释他们为何重要。"
"For {@bt_entity|::subscribed_books::vocabulary::entity}, rooted in {@bt_site|::subscribed_books::vocabulary::place}, the founding myth is as much a part of their identity as their language or their laws." = "对于扎根于 {@bt_site|::subscribed_books::vocabulary::place} 的 {@bt_entity|::subscribed_books::vocabulary::entity}，起源神话与语言、法律一样，是自身认同的一部分。"
"And in {@year}, the gods -- or fate -- moved again." = "{@year} 年，诸神——或者命运——再次行动。"
"{@bt_site|::subscribed_books::vocabulary::place} was raised in {@year}." = "{@bt_site|::subscribed_books::vocabulary::place} 于 {@year} 年建立。"
"The myths say the ground chose {@bt_entity|::subscribed_books::vocabulary::entity}, not the other way around." = "神话说，是这片土地选择了 {@bt_entity|::subscribed_books::vocabulary::entity}，并非相反。"
"The myths say {pos} blood nourished the earth of {@bt_site|::subscribed_books::vocabulary::place}." = "神话说，{pos}鲜血滋养了 {@bt_site|::subscribed_books::vocabulary::place} 的大地。"
"In {@year}, the will of {@bt_entity|::subscribed_books::vocabulary::entity} shaped the world once more." = "{@year} 年，{@bt_entity|::subscribed_books::vocabulary::entity} 的意志再次塑造了世界。"
"And so the myth grew, as myths must." = "神话就这样继续成长，正如神话总会做的那样。"
"This is the story {@bt_entity|::subscribed_books::vocabulary::entity} tells about itself." = "这便是 {@bt_entity|::subscribed_books::vocabulary::entity} 讲述自身的故事。"
"Whether it is true matters less than what it reveals about who they are." = "它是否真实，远不如它揭示了他们是谁那样重要。"
"The following is a scholarly analysis of the cultural development of {@bt_entity|::subscribed_books::vocabulary::entity}, centered on {@bt_site|::subscribed_books::vocabulary::place}." = "下文是以 {@bt_site|::subscribed_books::vocabulary::place} 为中心，对 {@bt_entity|::subscribed_books::vocabulary::entity} 文化发展的学术分析。"
"This work examines {@bt_entity|::subscribed_books::vocabulary::entity} through the lens of historical evidence and reasoned analysis." = "本书以历史证据和理性分析来考察 {@bt_entity|::subscribed_books::vocabulary::entity}。"
"A dispassionate examination of {@bt_entity|::subscribed_books::vocabulary::entity} reveals a culture of {adj} complexity, shaped by geography, circumstance, and the choices of key individuals." = "对 {@bt_entity|::subscribed_books::vocabulary::entity} 的冷静考察，揭示了一种{adj}复杂文化，它由地理、时势及关键人物的选择共同塑造。"
"This analysis draws on all available sources." = "本分析采用了所有可获得的资料。"
"The period around {@year} merits particular attention." = "{@year} 年前后的时期值得特别关注。"
"The death of {@bt_hero|::subscribed_books::vocabulary::person} in {@year} had measurable effects on {@bt_entity|::subscribed_books::vocabulary::entity}'s trajectory." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，对 {@bt_entity|::subscribed_books::vocabulary::entity} 的发展轨迹产生了可衡量的影响。"
"The founding of {@bt_site|::subscribed_books::vocabulary::place} in {@year} represented a calculated strategic decision by {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@year} 年 {@bt_site|::subscribed_books::vocabulary::place} 的建立，体现了 {@bt_entity|::subscribed_books::vocabulary::entity} 经过权衡的战略决策。"
"The creation of {@bt_artifact|::subscribed_books::vocabulary::artifact} by {@bt_hero|::subscribed_books::vocabulary::person} in {@year} reflects broader cultural trends within {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年创造的 {@bt_artifact|::subscribed_books::vocabulary::artifact}，反映了 {@bt_entity|::subscribed_books::vocabulary::entity} 内部更广泛的文化趋势。"
"The appointment of {@bt_hero|::subscribed_books::vocabulary::person} as {role} in {@year} indicates a shift in {@bt_entity|::subscribed_books::vocabulary::entity}'s leadership priorities." = "{@year} 年任命 {@bt_hero|::subscribed_books::vocabulary::person} 为 {role}，表明 {@bt_entity|::subscribed_books::vocabulary::entity} 领导层的优先事项发生了转变。"
"Events of {@year} are consistent with broader patterns observed in {@bt_entity|::subscribed_books::vocabulary::entity}'s development." = "{@year} 年的事件，与 {@bt_entity|::subscribed_books::vocabulary::entity} 发展中更广泛的规律相符。"
"Further analysis of this period supports the preceding conclusions." = "对这一时期的进一步分析支持上述结论。"
"This analysis of {@bt_entity|::subscribed_books::vocabulary::entity} is necessarily incomplete." = "这份关于 {@bt_entity|::subscribed_books::vocabulary::entity} 的分析必然不够完备。"
"Further research is recommended." = "建议开展进一步研究。"
"The scholarly examination of {@bt_entity|::subscribed_books::vocabulary::entity} concludes here." = "对 {@bt_entity|::subscribed_books::vocabulary::entity} 的学术考察到此结束。"
"The author acknowledges that objectivity is an aspiration rather than an achievement, and that the {adj} complexity of any civilization resists reduction to a single narrative." = "作者承认，客观性是一种追求，尚非已经实现的成果；任何文明{adj}复杂性，都无法被简化为单一叙事。"

[[rulesets]]
name = "alternate"
[rulesets.rules]
"What if things had gone differently?" = "如果事情走向了另一条道路呢？"
"What if {@bt_entity|::subscribed_books::vocabulary::entity} had chosen another path?" = "如果 {@bt_entity|::subscribed_books::vocabulary::entity} 选择了另一条道路呢？"
"This work imagines a world of {adj} possibility." = "本书想象了一个充满{adj}可能性的世界。"
"History is a record of what happened." = "历史记录着已经发生的事。"
"This book asks: what if something better had happened instead?" = "本书追问：如果当时发生的是更好的事呢？"
"The {adj} weight of history lies not only in what occurred, but in the infinite branching paths of what might have been." = "历史的{adj}重量，既在于发生过的事，也在于那些可能发生之事的无限岔路。"
"This work traces one such path -- a brighter one -- from a single moment of divergence." = "本书从一个分歧的瞬间出发，沿着其中一条更加明亮的道路前行。"
"Imagine, then, that in {@year} the outcome had been different." = "那么，想象一下，{@year} 年的结果原本可以不同。"
"What if {@bt_hero|::subscribed_books::vocabulary::person} had not died in {@year}?" = "如果 {@bt_hero|::subscribed_books::vocabulary::person} 没有在 {@year} 年死去呢？"
"What if {cause} had been averted?" = "如果 {cause} 得以避免呢？"
"Imagine {pro} alive, guiding {@bt_entity|::subscribed_books::vocabulary::entity} forward." = "想象{pro}仍然活着，指引着 {@bt_entity|::subscribed_books::vocabulary::entity} 前进。"
"In this imagined history, the founding of {@bt_site|::subscribed_books::vocabulary::place} in {@year} led to an age of unprecedented prosperity." = "在这段想象的历史中，{@year} 年 {@bt_site|::subscribed_books::vocabulary::place} 的建立引来一个空前繁荣的时代。"
"Had {@year} unfolded differently, the benefits would have cascaded forward through history." = "如果 {@year} 年有了不同的走向，它的好处便会在后世不断传递。"
"In this better world, the year ended with hope rather than regret." = "在这个更好的世界里，一年以希望结束，而非遗憾。"
"This is the world that could have been." = "这便是原本可能出现的世界。"
"It is a {adj} dream, perhaps, but a dream worth dreaming." = "也许这是一个{adj}梦，但它值得一梦。"
"Consider the alternative." = "想想另一种可能。"
"What if things had gone even worse?" = "如果事情变得更加糟糕呢？"
"This work imagines the {adj} darkness that might have been." = "本书想象了原本可能降临的{adj}黑暗。"
"History could have been crueler." = "历史原本可能更加残酷。"
"This alternate account explores just how cruel." = "这份假想的记述，探究它能残酷到什么程度。"
"In {@year}, imagine the worst possible outcome." = "想象 {@year} 年最坏的结果。"
"What if the death of {@bt_hero|::subscribed_books::vocabulary::person} in {@year} had been only the beginning of a {adj} cascade of destruction?" = "如果 {@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡，只是一连串{adj}毁灭的开端呢？"
"What if {@bt_site|::subscribed_books::vocabulary::place}, founded in {@year}, had become a place of horror rather than hope?" = "如果 {@year} 年建立的 {@bt_site|::subscribed_books::vocabulary::place}，最终成为了恐怖之地而非希望之地呢？"
"In this darker timeline, {@year} brought catastrophe upon catastrophe." = "在这条更加黑暗的时间线上，{@year} 年带来了一场又一场灾难。"
"And in this imagined world, things only got worse." = "在这个想象的世界中，一切只会越来越糟。"
"This is the world we were spared." = "这便是我们幸免于难的那个世界。"
"Let us be grateful, and vigilant." = "让我们心怀感激，也保持警惕。"
"Does history have a direction?" = "历史有方向吗？"
"Or is it all contingency?" = "还是一切都出于偶然？"
"This work examines a single moment and asks: what does it mean that things happened as they did?" = "本书考察一个瞬间，并追问：事情以这样的方式发生，究竟意味着什么？"
"The philosophical examination of historical contingency is the {adj} project of this work." = "对历史偶然性进行哲学考察，是本书{adj}课题。"
"By imagining alternative outcomes, we illuminate the nature of causation, agency, and fate itself." = "通过想象不同的结果，我们揭示因果、能动性以及命运本身的性质。"
"Consider the year {@year} and the choices that were made." = "考察 {@year} 年，以及那时做出的选择。"
"The death of {@bt_hero|::subscribed_books::vocabulary::person} in {@year} raises the question: was it inevitable?" = "{@bt_hero|::subscribed_books::vocabulary::person} 于 {@year} 年的死亡提出了一个问题：这是否不可避免？"
"Or was it a choice, made by individuals in a moment of freedom?" = "还是说，这是个人在某个自由瞬间做出的选择？"
"The events of {@year} could have unfolded differently." = "{@year} 年的事件原本可能有不同的走向。"
"What does it mean that they did not?" = "但它们没有，这又意味着什么？"
"The question remains open." = "这个问题仍未有答案。"
"Philosophy demands that we sit with uncertainty." = "哲学要求我们与不确定性共处。"
"This work offers no answers." = "本书没有提供答案。"
"Only better questions." = "只有更好的问题。"
"We study the road not taken to understand why we walk the one we do." = "我们研究那条未走的道路，是为了理解为何走上如今这一条。"
"What if history were even more absurd than it already is?" = "如果历史比它已经呈现的样子更加荒诞呢？"
"This work imagines the most ridiculous alternative." = "本书想象了最荒唐的另一种可能。"
"History is a comedy written by a drunk god." = "历史是一位醉神写出的喜剧。"
"This alternate history makes the comedy explicit." = "这部假想历史把喜剧的本质直接展现出来。"
"In {@year}, things could have been even more ridiculous." = "{@year} 年，一切原本可能更加荒唐。"
"What if {@bt_hero|::subscribed_books::vocabulary::person} hadn't died in {@year}?" = "如果 {@bt_hero|::subscribed_books::vocabulary::person} 没有在 {@year} 年死去呢？"
"It would explain a lot." = "那样就能解释很多事。"
"Imagine if {@bt_site|::subscribed_books::vocabulary::place} had been founded on a dare in {@year}." = "想象一下，{@bt_site|::subscribed_books::vocabulary::place} 是在 {@year} 年因一次激将而建立的。"
"Honestly, the real version isn't much better." = "说实话，真实的版本也好不到哪里去。"
"The year {@year}: now imagine it exactly the same, but everyone realizes how absurd it is." = "{@year} 年：想象一切照旧，只是每个人都意识到了其中的荒诞。"
"And so the farce continued, as it always does." = "闹剧如往常一样，继续上演。"
"This alternate history is no more ridiculous than the real one." = "这部假想历史并不比真实历史更加荒唐。"
"Think about that." = "想想这一点吧。"
"This work mourns what might have been." = "本书哀悼那些原本可能出现的事物。"
"It is an elegy for a future that never arrived." = "这是献给从未到来之未来的挽歌。"
"We lost something in the moment history turned." = "历史转向的那一刻，我们失去了某些东西。"
"This book tries to name what it was." = "本书试图为那些失去之物命名。"
"This alternate history is born of that grief." = "这部假想历史诞生于那份哀伤。"
"In {@year}, the world could have been different." = "{@year} 年，世界原本可能不同。"
"It wasn't." = "但并没有。"
"In another world, {pro} didn't." = "在另一个世界里，{pro}没有死去。"
"That world was kinder." = "那个世界更加温柔。"
"{@bt_site|::subscribed_books::vocabulary::place} was founded in {@year}." = "{@bt_site|::subscribed_books::vocabulary::place} 于 {@year} 年建立。"
"In the world that never was, it was a place of peace." = "在那个从未出现的世界中，它是一处和平之地。"
"Somewhere, in a timeline we cannot reach, it passed more gently." = "在某处，在一条我们无法抵达的时间线上，这一年过得更温柔。"
"The mourning continues." = "哀悼仍在继续。"
"It is the only appropriate response." = "这是唯一恰当的回应。"
"This is the elegy for the world we lost." = "这便是献给我们失去的世界的挽歌。"
"It was never real, but its absence is." = "它从未真实存在，但它的缺席是真实的。"
"This alternate history is a love letter to a world that existed only in the space between heartbeats." = "这部假想历史是一封情书，写给那个只存在于心跳间隙中的世界。"
"It was beautiful." = "它曾经美丽。"
"It was impossible." = "它不可能存在。"
"It was ours, and we never had it." = "它属于我们，而我们从未拥有过它。"

[[rulesets]]
name = "genealogy"
[rulesets.rules]
"THE LINEAGE OF {person}, {race} of {@bt_entity|::subscribed_books::vocabulary::entity}." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的 {race} {person} 的谱系。"
"What follows is not narrative but record -- read the tree, not a story about the tree." = "下文是一份记录而非叙事——请阅读族谱树，而不是族谱树的故事。"
"THE PEDIGREE OF {person}, {race} of {@bt_entity|::subscribed_books::vocabulary::entity}, set down in the form proper to such records: by generation, not by anecdote." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的 {race} {person} 的家谱，以适当的记录形式写下：按世代排列，而非按轶事。"
"The record continues with connections recorded circa {@year}:" = "记录继续，以下是约 {@year} 年记载的关系："
"{person} died in {@year} ({cause})." = "{person} 于 {@year} 年死去（{cause}）。"
"The line continues below regardless." = "无论如何，谱系继续列于下方。"
"{@bt_hero|::subscribed_books::vocabulary::person} was named {role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@year}." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 被任命为 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {role}。"
"Recorded here for completeness of the family record." = "在此录入，以保证家族记录的完整。"
"Update to the record, {@year}." = "{@year} 年，更新记录。"
"The tree, once drawn, is not redrawn -- only extended." = "族谱树一经绘成，就不再重绘，只会继续延伸。"
"This pedigree of {person} is complete as of this writing." = "截至成书之时，这份 {person} 的家谱已记录完备。"
"Future generations will extend it; none should redraw it." = "后来的世代将继续延伸它；任何人都不应重绘它。"
"A RECORD OF ASCENT: the pedigree of {person}, whose line rose from obscurity." = "崛起的记录：{person} 的家谱，其家系由无名而兴起。"
"Presented as a tree, not a tale." = "以族谱树呈现，而非故事。"
"Additions to the record as of {@year}:" = "截至 {@year} 年新增的记录："
"{@bt_hero|::subscribed_books::vocabulary::person} became {role} of {@bt_entity|::subscribed_books::vocabulary::entity} in {@year} -- the first such distinction recorded for this line." = "{@year} 年，{@bt_hero|::subscribed_books::vocabulary::person} 成为 {@bt_entity|::subscribed_books::vocabulary::entity} 的 {role}——这是此家系有记录以来首次获得这种殊荣。"
"{person} died {@year} ({cause}), before the line's full rise was complete." = "{person} 于 {@year} 年死去（{cause}），当时家系的崛起尚未完成。"
"The record stands as follows." = "现有记录如下。"
"The line continued, {@year}." = "{@year} 年，家系继续延续。"
"Further generations may extend this tree; none have yet." = "后来的世代也许会延伸这棵族谱树，目前还没有。"
"From an unremarkable root to this recorded tree: the pedigree of {person}, as it stands." = "从平凡的根源到这棵有记录的族谱树：这便是 {person} 家谱的现状。"
"A RECORD KEPT DESPITE ITS SUBJECT: the pedigree of {person}, whose line is not spoken of kindly." = "无论对象如何，记录仍须保存：这是 {person} 的家谱，世人谈起这个家系时并不友善。"
"The tree is recorded regardless of what is said about it." = "无论人们如何议论，这棵族谱树都照样记录。"
"THE PEDIGREE OF {person}." = "{person} 的家谱。"
"Whatever is said of this line elsewhere, the record here is kept to the same standard as any other." = "无论外界如何评价这个家系，这里的记录都遵循与其他家系相同的标准。"
"Entries added to the record, {@year}:" = "{@year} 年，新增记录如下："
"{person} died {@year} ({cause})." = "{person} 于 {@year} 年死去（{cause}）。"
"The record is kept regardless of what is made of it." = "无论如何解读，这份记录仍会保存。"
"Recorded without embellishment, {@year}." = "{@year} 年，如实记载，不加修饰。"
"The record continues, plainly, as before." = "记录如前，平实地继续。"
"A pedigree is a record, not a verdict." = "家谱是一份记录，并非裁决。"
"This one is offered as exactly that." = "本家谱也正是如此。"
"-- kept for {person}" = "——为 {person} 保存"

[[rulesets]]
name = "expansion"
[rulesets.rules]
"The record continues." = "记录继续。"
"Consider the implications." = "想想其中的含义。"
"If this is true -- and the evidence suggests it is -- then much of what we have assumed about {@bt_entity|::subscribed_books::vocabulary::entity} must be reconsidered." = "如果这是真的——证据表明的确如此——那么我们对于 {@bt_entity|::subscribed_books::vocabulary::entity} 的许多假设都必须重新审视。"
"The foundations of our understanding are not as solid as we believed." = "我们认识的根基，并不像曾经相信的那样牢固。"
"One might object that the circumstances were unique, that what happened in {@year} at {@bt_site|::subscribed_books::vocabulary::place} could not happen again." = "有人也许会反驳，当时的情形是独一无二的，{@year} 年在 {@bt_site|::subscribed_books::vocabulary::place} 发生的事情不可能重演。"
"This objection is understandable but ultimately unconvincing." = "这种反驳可以理解，却终究无法令人信服。"
"History does not repeat itself, but it rhymes, and the rhyme scheme of {@bt_entity|::subscribed_books::vocabulary::entity} is by now well established." = "历史不会原样重演，却会押韵；而 {@bt_entity|::subscribed_books::vocabulary::entity} 的韵脚，如今早已成形。"
"The counterargument is worth examining." = "反方的论点值得考察。"
"Those who disagree point to the prosperity of {@bt_site|::subscribed_books::vocabulary::place}, to the stability of {@bt_entity|::subscribed_books::vocabulary::entity}'s institutions, to the general contentment of the populace." = "反对者指出，{@bt_site|::subscribed_books::vocabulary::place} 很繁荣，{@bt_entity|::subscribed_books::vocabulary::entity} 的制度很稳定，民众普遍感到满意。"
"All true." = "这些全都属实。"
"All irrelevant." = "但也全都无关。"
"Prosperity is not a shield against folly; it is, more often, the breeding ground." = "繁荣不能抵挡愚行；更多时候，它恰恰是愚行的温床。"
"Let us examine the evidence more closely." = "让我们更仔细地考察证据。"
"In {@year}, the situation at {@bt_site|::subscribed_books::vocabulary::place} was as follows: resources were strained, leadership was uncertain, and the populace was divided." = "{@year} 年，{@bt_site|::subscribed_books::vocabulary::place} 的局势如下：资源紧张，领导层举棋不定，民众相互分裂。"
"These are not the conditions under which wise decisions are made." = "这样的条件无法催生明智的决策。"
"They are the conditions under which decisions are made quickly, and quickly is rarely wisely." = "这样的条件只会催生仓促的决策，而仓促往往并不明智。"
"There is a tendency among scholars of {@bt_entity|::subscribed_books::vocabulary::entity} to treat this period as an aberration -- a deviation from the natural order." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的学者往往把这段时期视为异常——偏离自然秩序的插曲。"
"I would argue the opposite: this period reveals the natural order." = "我却认为恰好相反：这段时期揭示的正是自然秩序。"
"Everything else is the aberration." = "其余一切才是异常。"
"The moral dimension cannot be ignored." = "道德层面不能忽视。"
"What happened was not merely a political event or an economic event." = "发生的不只是一桩政治事件或经济事件。"
"It was a test of character -- the character of {@bt_entity|::subscribed_books::vocabulary::entity}, of its leaders, of its people." = "这是一场品格的考验——考验 {@bt_entity|::subscribed_books::vocabulary::entity}、其领袖和其人民的品格。"
"The results of that test are recorded in these pages, and they are not flattering." = "考验的结果记录在这些书页中，而这些结果并不光彩。"
"History will judge." = "历史自会评判。"
"It always does." = "它一直如此。"
"The question is not whether {@bt_entity|::subscribed_books::vocabulary::entity} acted correctly -- that much is debatable -- but whether it acted honestly." = "问题不是 {@bt_entity|::subscribed_books::vocabulary::entity} 做得是否正确——这一点尚可争论——而是它是否诚实行事。"
"Honesty is rarer than correctness, and more valuable." = "诚实比正确更罕见，也更有价值。"
"Some will read this and feel anger." = "有些人读完会感到愤怒。"
"Good." = "很好。"
"Anger is the appropriate response to what happened." = "面对发生的事情，愤怒是恰当的反应。"
"The inappropriate response is indifference, which is what {@bt_entity|::subscribed_books::vocabulary::entity} has practiced for far too long." = "不恰当的反应是冷漠，而 {@bt_entity|::subscribed_books::vocabulary::entity} 已经冷漠太久了。"
"I do not claim objectivity." = "我不声称自己完全客观。"
"No honest writer does." = "诚实的作者都不会这样声称。"
"What I claim is accuracy, and accuracy is a harder standard to meet." = "我所追求的是准确，而准确是更难达到的标准。"
"Every fact in this work has been verified." = "本书中的每项事实都经过核实。"
"The conclusions are my own, and I stand by them." = "结论属于我自己，我也愿意为它们负责。"
"The lesson of {@year} is not that bad things happen." = "{@year} 年的教训，并不是坏事会发生。"
"Bad things always happen." = "坏事总会发生。"
"The lesson is that bad things happen when good people convince themselves that doing nothing is the same as doing no harm." = "真正的教训是，当好人说服自己，认为无所作为就等于不伤害他人时，坏事便会发生。"
"SPEAKER: But surely you cannot mean --" = "发问者：但你总不至于想说——"
"RESPONDENT: I mean exactly what I said." = "答者：我的意思就是我说的那样。"
"The truth is uncomfortable." = "真相令人不快。"
"That is how you know it is the truth." = "正因如此，你才知道它是真相。"
"SPEAKER: And if you are wrong?" = "发问者：如果你错了呢？"
"RESPONDENT: Then I am wrong honestly, which is better than being right by accident." = "答者：那我也是诚实地犯错，这比碰巧说对了要好。"
"SPEAKER: The people of {@bt_entity|::subscribed_books::vocabulary::entity} would disagree with you." = "发问者：{@bt_entity|::subscribed_books::vocabulary::entity} 的人民不会同意你。"
"RESPONDENT: The people of {@bt_entity|::subscribed_books::vocabulary::entity} disagree with each other." = "答者：{@bt_entity|::subscribed_books::vocabulary::entity} 的人民彼此也不同意。"
"That is the nature of people." = "这就是人的本性。"
"Agreement is the province of the dead." = "只有死者才会全然一致。"
"SPEAKER: That is... bleak." = "发问者：这真是……悲观。"
"RESPONDENT: It is accurate." = "答者：这是准确。"
"Bleak is your interpretation." = "悲观只是你的解读。"
"SPEAKER: Tell me about {@bt_site|::subscribed_books::vocabulary::place}." = "发问者：和我说说 {@bt_site|::subscribed_books::vocabulary::place} 吧。"
"What was it like?" = "那里是什么样的？"
"RESPONDENT: Cold." = "答者：寒冷。"
"Beautiful." = "美丽。"
"Full of people who believed they were building something permanent." = "那里尽是相信自己正在建造永恒之物的人。"
"They were wrong, of course, but the belief itself was magnificent." = "当然，他们错了，但那份信念本身很壮丽。"
"SPEAKER: You admired them?" = "发问者：你敬佩他们？"
"RESPONDENT: I admired their conviction." = "答者：我敬佩他们的信念。"
"Their judgment was another matter entirely." = "至于他们的判断，则完全是另一回事。"
"SPEAKER: What would you have done differently?" = "发问者：换成你，会做出什么不同的选择？"
"RESPONDENT: Everything." = "答者：一切。"
"Nothing." = "或者什么都不改变。"
"The tragedy of hindsight is that it reveals not what should have been done, but how impossible it was to have done it." = "事后回顾的悲剧在于，它揭示的并非当时应该做什么，而是当时做到那些事有多么不可能。"
"SPEAKER: That sounds like an excuse." = "发问者：这听起来像借口。"
"RESPONDENT: It sounds like wisdom." = "答者：这听起来像智慧。"
"The difference is subtle." = "两者的差别很微妙。"
"SPEAKER: And the events of {@year}?" = "发问者：那 {@year} 年的事件呢？"
"How do you explain those?" = "你如何解释？"
"RESPONDENT: I don't." = "答者：我不解释。"
"Some things resist explanation." = "有些事情拒绝解释。"
"They simply happen, and we are left to arrange the pieces into a pattern that comforts us." = "它们就这么发生了，留下我们把碎片拼成一个能让自己宽慰的图案。"
"SPEAKER: Is that what you're doing now?" = "发问者：你现在做的也是这个吗？"
"RESPONDENT: (long pause) Perhaps." = "答者：（长久的停顿）也许吧。"
"SPEAKER: Do you think there is hope for {@bt_entity|::subscribed_books::vocabulary::entity}?" = "发问者：你觉得 {@bt_entity|::subscribed_books::vocabulary::entity} 还有希望吗？"
"RESPONDENT: There is always hope." = "答者：希望总会有。"
"Hope is the cheapest commodity in the world." = "希望是世上最廉价的商品。"
"What there is less of is wisdom, and wisdom is what {@bt_entity|::subscribed_books::vocabulary::entity} needs." = "缺少的是智慧，而 {@bt_entity|::subscribed_books::vocabulary::entity} 需要的正是智慧。"
"SPEAKER: Can wisdom be taught?" = "发问者：智慧能教给别人吗？"
"RESPONDENT: No." = "答者：不能。"
"But it can be demonstrated." = "但可以示范。"
"That is the purpose of this conversation." = "这便是这场谈话的目的。"
"I write this by candlelight, and the flame gutters in the draft." = "我借着烛光写下这些，火焰在穿堂风中摇曳。"
"The nights here are long and the walls are thin." = "这里的夜晚很漫长，墙壁也很薄。"
"I can hear the wind outside, and sometimes other things that might be the wind." = "我能听见外面的风声，有时还有别的声音，也许也是风。"
"I try not to think about it." = "我尽量不去想它。"
"The food is terrible." = "食物糟糕透了。"
"I mention this not to complain -- though I am complaining -- but because it tells you something about this place." = "我提到这一点，并非想抱怨——虽然我确实在抱怨——而是因为它能告诉你这个地方的某些特点。"
"A people who cook like this have other priorities." = "这样做饭的民族，必定把其他事情看得更重要。"
"I am still trying to determine what those priorities are." = "我还在试图弄明白，那些更重要的事情究竟是什么。"
"Do you remember the autumn we spent in {@bt_site|::subscribed_books::vocabulary::place}?" = "你还记得我们在 {@bt_site|::subscribed_books::vocabulary::place} 度过的那个秋天吗？"
"I think about it more than I should." = "我想起它的次数，多得超过了应有的程度。"
"The leaves turning, the smoke from the chimneys, the way the light fell through the windows in the afternoon." = "变色的树叶，烟囱中的炊烟，以及午后光线穿过窗子的样子。"
"It seems like another lifetime now." = "如今，那仿佛是另一个人生。"
"Perhaps it was." = "也许它确实是。"
"I have made a friend here, of sorts." = "我在这里交了一个朋友，姑且算是。"
"An old {race} who speaks little but sees everything." = "一个年老的 {race}，话不多，却看得清一切。"
"{@bt_hero|::subscribed_books::vocabulary::person} reminds me of you, in a way that I cannot quite explain." = "{@bt_hero|::subscribed_books::vocabulary::person} 让我想起你，这种感觉我说不太清楚。"
"Perhaps it is the silence." = "也许是因为沉默。"
"You were always comfortable with silence." = "你总能安然地与沉默共处。"
"I never learned the trick." = "我从未学会这份本领。"
"The days blur together." = "日子渐渐混成一团。"
"I mark them on the wall with a knife, but I have lost count twice already." = "我用刀在墙上刻记号，却已经数错了两次。"
"Time moves differently here -- not slower, not faster, just differently, as if it has its own agenda that does not include me." = "这里的时间流逝得很不同——并非更慢或更快，只是不同，仿佛它有自己的安排，而我不在其中。"
"I miss home." = "我想家了。"
"I miss the sound of familiar voices and the smell of bread baking and the particular shade of grey that the sky turns before rain." = "我想念熟悉的声音、烤面包的气味，以及下雨前天空特有的那种灰色。"
"I miss knowing what will happen next." = "我想念那种知道接下来会发生什么的感觉。"
"Here, nothing is predictable, and I am very tired of surprises." = "在这里，没有什么可以预料，而我已经厌倦了意外。"
"There is a rumor going around about events at {@bt_site|::subscribed_books::vocabulary::place}." = "关于 {@bt_site|::subscribed_books::vocabulary::place} 发生的事情，最近流传着一则传闻。"
"I do not know how much of it is true, but the mere fact of the rumor tells you something about the mood here." = "我不知道其中多少属实，但仅仅是传闻的存在，就足以说明这里的气氛。"
"People believe the worst because the worst has become plausible." = "人们相信最坏的说法，因为最坏的情形已经变得可信。"
"I have been reading." = "最近我一直在读书。"
"There is a library here, of sorts -- a shelf of water-damaged scrolls and a few books that have survived more than they should." = "这里姑且算有一座图书馆——一架受过水损的卷轴，和几本经历了过多磨难却仍然存世的书。"
"I found one about {@bt_entity|::subscribed_books::vocabulary::entity} that made me laugh and then made me sad." = "我找到一本关于 {@bt_entity|::subscribed_books::vocabulary::entity} 的书，它先让我发笑，随后又让我难过。"
"The author was either a fool or a genius." = "作者不是傻瓜，就是天才。"
"I suspect both." = "我怀疑两者兼是。"
"Imagine, then, the morning after." = "那么，想象一下第二天清晨。"
"The sun rises on a {@bt_site|::subscribed_books::vocabulary::place} that never knew the events of {@year}." = "太阳照耀着一个从未经历 {@year} 年事件的 {@bt_site|::subscribed_books::vocabulary::place}。"
"The streets are the same." = "街道依旧。"
"The buildings are the same." = "建筑依旧。"
"But the people -- ah, the people are different." = "但人们——啊，人们不同了。"
"They walk with a lightness that the real {@bt_site|::subscribed_books::vocabulary::place} lost long ago." = "他们的步履轻盈，而真实的 {@bt_site|::subscribed_books::vocabulary::place} 早已失去了这种轻盈。"
"In this alternate history, {@bt_entity|::subscribed_books::vocabulary::entity} takes a different path." = "在这部假想历史中，{@bt_entity|::subscribed_books::vocabulary::entity} 走上了另一条道路。"
"Not a better path, necessarily -- that is for the reader to judge -- but a different one." = "未必是更好的道路——这应由读者判断——但确实不同。"
"The consequences ripple outward like stones dropped in still water, and by the time they reach the shore, the landscape is unrecognizable." = "后果如石子投入静水般向外扩散，涟漪到达岸边时，风景已经面目全非。"
"What would the world look like without the events we take for granted?" = "如果没有那些我们视为理所当然的事件，世界会是什么样？"
"Smaller, perhaps." = "也许更小。"
"Or larger." = "也许更大。"
"It is impossible to say with certainty, which is precisely the point." = "不可能肯定地回答，这也正是问题的关键。"
"Certainty is the enemy of imagination, and imagination is what this work demands." = "确定性是想象力的敌人，而本书需要的正是想象力。"
"The people who lived through the real events would not recognize this version." = "经历过真实事件的人，不会认出这个版本。"
"They would call it fantasy, or wish-fulfillment, or naivety." = "他们会说，这是幻想，是满足愿望的臆想，或者天真。"
"They might be right." = "他们也许是对的。"
"But being right is not the same as being interesting, and this alternate history aspires to be at least that." = "但正确不等于有趣，而这部假想历史至少希望做到后者。"
"Consider the children." = "想想孩子们。"
"In the real history, they grew up in the shadow of what happened in {@year}." = "在真实历史中，他们在 {@year} 年事件的阴影下长大。"
"In this alternate version, they grow up in sunlight." = "在这个假想版本中，他们在阳光下长大。"
"Is that better?" = "这更好吗？"
"More just?" = "更公正吗？"
"Or is it merely different?" = "还是仅仅不同？"
"The answer depends on which children you ask." = "答案取决于你问的是哪些孩子。"
"One small change." = "只需一个小小的改变。"
"That is all it would have taken." = "原本只需要这么一点。"
"One decision made differently, one word spoken instead of swallowed, one hand extended instead of withdrawn." = "一次不同的决定，一句话被说出而不是咽下，一只手伸出而不是收回。"
"The distance between what happened and what might have happened is measured in heartbeats." = "真实发生之事与原本可能发生之事之间，距离不过以心跳来衡量。"
"Step the first: prepare the workspace." = "第一步：准备工作场地。"
"Ensure adequate ventilation and sufficient lighting." = "确保通风良好、照明充足。"
"A cluttered workspace is not merely inconvenient; it is dangerous." = "凌乱的工作场地不只是碍事，更会带来危险。"
"Remove all unnecessary materials before proceeding." = "继续之前，移走所有不需要的材料。"
"The novice will be tempted to rush." = "新手容易急于求成。"
"Resist this temptation." = "抵制这种冲动。"
"Speed comes with practice, and practice begins with patience." = "速度来自练习，而练习始于耐心。"
"Every master was once a student who did the same thing badly a hundred times before doing it well once." = "每位大师都曾是学徒，在第一次做好之前，同一件事也做坏过上百次。"
"Common mistakes at this stage include: applying too much pressure, using materials of insufficient quality, and neglecting to account for ambient temperature." = "这一阶段常见的错误包括：用力过大、使用品质不足的材料，以及忽略环境温度。"
"All three are avoidable." = "这三种错误都可以避免。"
"The first requires discipline." = "第一种需要克制。"
"The second requires investment." = "第二种需要投入。"
"The third requires attention." = "第三种需要留心。"
"A note on materials." = "关于材料的一点说明。"
"The quality of your materials determines the ceiling of your results." = "材料的质量决定了成果的上限。"
"No technique, however refined, can compensate for inferior inputs." = "再精湛的技法，也无法弥补低劣的原料。"
"Source the best materials available to you, and treat them with the respect they deserve." = "寻找你能获得的最好材料，并给予它们应有的尊重。"
"The technique described here was first developed in {@bt_site|::subscribed_books::vocabulary::place} around the year {@year}." = "这里描述的技法，最初于约 {@year} 年在 {@bt_site|::subscribed_books::vocabulary::place} 发明。"
# narrative.lua 缺少地点和组织时以 wc.title 填入 site；保留书名的问号等标点。
# capitalize_sentences 会将书名末尾标点后的 around 改为 Around，两种形式都消费完整句子。
"The technique described here was first developed in {::text::book} around the year {::subscribed_books::vocabulary::year}." = "这里描述的技法，最早于约 {::subscribed_books::vocabulary::year} 年见于《{::text::book}》。"
"The technique described here was first developed in {::text::book} Around the year {::subscribed_books::vocabulary::year}." = "这里描述的技法，最早于约 {::subscribed_books::vocabulary::year} 年见于《{::text::book}》。"
"It has been refined many times since, but the core principles remain unchanged." = "此后它经过多次改进，但核心原理依然不变。"
"What works, works." = "有效的方法就是有效。"
"The fundamentals are called fundamental for a reason." = "基础之所以称为基础，自有其道理。"
"Safety is not optional." = "安全不是可有可无的。"
"The dangers associated with this work are real and well-documented." = "这项工作相关的危险真实存在，也有充分记录。"
"Protective equipment should be worn at all times." = "应当始终佩戴防护装备。"
"If you are unsure whether a precaution is necessary, it is." = "如果你不确定某项预防措施是否必要，那它就是必要的。"
"At this point, the student should practice on scrap material before attempting the real thing." = "此时，学徒应先在废料上练习，再尝试正式制作。"
"There is no shame in practice." = "练习并不可耻。"
"There is considerable shame in ruining good material through impatience." = "因为急躁而毁坏好材料，才是十分可耻的。"
"The mark of a true craftsman is not the absence of mistakes but the ability to recover from them." = "真正工匠的标志，不是从不犯错，而是能够从错误中挽回。"
"The mark of a true craftsman is the ability to recover from mistakes." = "真正工匠的标志，是能够在出错后设法补救。"
"When something goes wrong -- and it will -- do not panic." = "发生错误时——错误一定会发生——不要慌乱。"
"Assess the situation, determine the cause, and correct course." = "评估情形、找出原因，再调整做法。"
"The material is more forgiving than you think." = "材料比你想象的更容得下错误。"
"Advanced practitioners may modify this technique to suit their particular circumstances." = "熟练者可以调整这套技法，使其适合自己的具体情形。"
"Such modifications are encouraged, provided they are based on understanding rather than guesswork." = "只要调整建立在理解之上而非猜测，就值得鼓励。"
"Innovation built on ignorance is not innovation; it is gambling." = "建立在无知上的创新不是创新，而是赌博。"
"This section concludes with a reminder: the knowledge contained herein was purchased with years of effort, countless failures, and no small amount of blood." = "本节以一则提醒作结：其中的知识，是以多年的努力、无数次失败和相当多的鲜血换来的。"
"Treat it accordingly." = "请给予它应有的重视。"
"The approach to {@bt_site|::subscribed_books::vocabulary::place} is marked by a gradual change in the landscape." = "接近 {@bt_site|::subscribed_books::vocabulary::place} 时，周围景观会逐渐改变。"
"The trees grow shorter and more twisted, the soil turns from brown to grey, and the wind carries a smell that is not quite pleasant and not quite identifiable." = "树木越来越矮，也越来越扭曲；土壤从棕色变为灰色；风中带着一种不太好闻，却又辨认不出的气味。"
"You know you are close when the birds stop singing." = "当鸟儿停止鸣唱时，你便知道已经不远了。"
"The inhabitants of {@bt_site|::subscribed_books::vocabulary::place} are a practical people." = "{@bt_site|::subscribed_books::vocabulary::place} 的居民十分务实。"
"They do not waste words on strangers, but neither are they hostile." = "他们不会对陌生人多费口舌，却也没有敌意。"
"Earn their respect through deeds, not speeches, and you will find them reliable allies." = "以行动而非空谈赢得他们的尊重，你就会发现他们是可靠的盟友。"
"Disappoint them, and you will find the doors of {@bt_site|::subscribed_books::vocabulary::place} closed to you permanently." = "若让他们失望，{@bt_site|::subscribed_books::vocabulary::place} 的大门便会永远对你关闭。"
"The central hall of {@bt_site|::subscribed_books::vocabulary::place} deserves particular attention." = "{@bt_site|::subscribed_books::vocabulary::place} 的中央大厅值得特别留意。"
"Its construction reflects the values of {@bt_entity|::subscribed_books::vocabulary::entity} -- solid, functional, and without unnecessary ornamentation." = "它的建筑体现了 {@bt_entity|::subscribed_books::vocabulary::entity} 的价值观——坚固、实用，没有多余的装饰。"
"The pillars are thick enough to withstand a siege." = "柱子粗壮，足以经受围城。"
"The roof is low enough to retain heat." = "屋顶低矮，足以留住热量。"
"Every element serves a purpose." = "每一处构造都有其用途。"
"The surrounding lands support a variety of resources." = "周边土地出产多种资源。"
"To the north, dense forests provide timber and game." = "北面，茂密的森林提供木材与猎物。"
"To the south, open fields yield grain and livestock." = "南面，开阔的田野出产粮食与牲畜。"
"To the east, the river provides water, fish, and a natural defensive boundary." = "东面，河流提供水和鱼，也构成天然的防御边界。"
"To the west -- well, few travelers go west and return." = "至于西面——嗯，向西去的旅人很少有人回来。"
"Market days at {@bt_site|::subscribed_books::vocabulary::place} are worth experiencing." = "{@bt_site|::subscribed_books::vocabulary::place} 的集市日值得体验。"
"Traders from across {@bt_entity|::subscribed_books::vocabulary::entity}'s territory bring goods that cannot be found elsewhere: rare metals, exotic fabrics, preserved foods of uncertain origin, and stories that may or may not be true." = "来自 {@bt_entity|::subscribed_books::vocabulary::entity} 各地的商人带来别处难寻的货物：稀有金属、异域织物、来历不明的腌藏食品，以及真假难辨的故事。"
"Bring coin and skepticism in equal measure." = "带足钱币，也带上同样多的怀疑。"
"A word about the weather." = "再说说天气。"
"{@bt_site|::subscribed_books::vocabulary::place} experiences extremes that the lowlander may find challenging." = "{@bt_site|::subscribed_books::vocabulary::place} 的极端气候，对来自低地的人可能是一场考验。"
"Winters are long, dark, and merciless." = "冬季漫长、阴暗而无情。"
"Summers are brief, bright, and surprisingly pleasant." = "夏季短暂、明亮，却出人意料地舒适。"
"The transitions between seasons are abrupt and violent." = "季节之间的转换突然而猛烈。"
"Dress accordingly." = "请相应准备衣物。"
"The water supply at {@bt_site|::subscribed_books::vocabulary::place} comes from a deep well that has never been known to run dry." = "{@bt_site|::subscribed_books::vocabulary::place} 的用水来自一口深井，没人听说过它曾经干涸。"
"Local legend attributes this to divine favor." = "当地传说将此归功于神灵的眷顾。"
"A more practical explanation involves the aquifer that runs beneath the settlement, fed by snowmelt from the peaks above." = "更实际的解释是，聚落下方有一层含水层，接受上方山峰融雪的补给。"
"Both explanations are satisfying in their own way." = "两种解释各有令人满意之处。"
"For the visitor interested in history, {@bt_site|::subscribed_books::vocabulary::place} offers several notable landmarks." = "对于喜爱历史的访客，{@bt_site|::subscribed_books::vocabulary::place} 有数处值得关注的地标。"
"The old gatehouse, partially collapsed but still impressive, dates to the founding era." = "古老的门楼建于开拓时期，虽已部分坍塌，仍然气势不凡。"
"The memorial stones near the eastern wall record the names of those lost in the great siege." = "东墙附近的纪念石上，记录着大围城中死者的名字。"
"The brewery is the oldest operating business in the settlement and produces an ale that is, by all accounts, an acquired taste." = "酿酒坊是聚落中仍在营业的最古老商号；据说它酿出的麦酒，必须喝惯了才会喜欢。"
"Cross-reference: this entry should be read in conjunction with the entries on {@bt_entity|::subscribed_books::vocabulary::entity} and {@bt_site|::subscribed_books::vocabulary::place}." = "交叉参照：本条应与 {@bt_entity|::subscribed_books::vocabulary::entity} 及 {@bt_site|::subscribed_books::vocabulary::place} 的条目一起阅读。"
"The connections between these subjects are more extensive than a single entry can adequately convey." = "这些主题之间的联系十分广泛，单个条目不足以充分说明。"
"Scholarly opinion on this subject remains divided." = "学界对于这一主题仍然意见不一。"
"The traditionalist school holds that the events described were inevitable, the product of forces too large for any individual to redirect." = "传统学派认为，这些事件不可避免，是个人无法改变的巨大力量所造成的。"
"The revisionist school argues that individual choices -- particularly those made by {@bt_hero|::subscribed_books::vocabulary::person} -- were decisive." = "修正学派则认为，个人选择——尤其是 {@bt_hero|::subscribed_books::vocabulary::person} 的选择——起到了决定作用。"
"The evidence supports both positions, which is to say it supports neither conclusively." = "证据同时支持两种立场，也就是说，它没有确凿地支持任何一方。"
"A note on sources: the primary documentation for this subject is incomplete." = "资料说明：这一主题的原始文献并不完备。"
"Several key records were destroyed in the events of {@year}, and what remains is filtered through the perspectives of those who survived." = "若干关键记录毁于 {@year} 年的事件，留下的资料又经过了幸存者视角的筛选。"
"The historian must tread carefully here, distinguishing between what is known, what is inferred, and what is simply believed." = "历史学者在此必须谨慎，分清哪些已知、哪些推断而来、哪些仅仅是相信。"
"The cultural significance of this subject extends beyond the borders of {@bt_entity|::subscribed_books::vocabulary::entity}." = "这一主题的文化意义，超出了 {@bt_entity|::subscribed_books::vocabulary::entity} 的边界。"
"Neighboring civilizations have their own accounts of the events described here, and these accounts differ in instructive ways." = "相邻文明对这些事件也有各自的记述，其差异颇具启发。"
"Where {@bt_entity|::subscribed_books::vocabulary::entity} sees heroism, others see aggression." = "{@bt_entity|::subscribed_books::vocabulary::entity} 眼中的英勇，在他人看来是侵略。"
"Where {@bt_entity|::subscribed_books::vocabulary::entity} sees tragedy, others see justice." = "{@bt_entity|::subscribed_books::vocabulary::entity} 眼中的悲剧，在他人看来是正义。"
"The truth, as usual, is somewhere in the disagreement." = "如往常一样，真相就在分歧的某处。"
"For a popular account of this subject, see the ballads collected by the bards of {@bt_site|::subscribed_books::vocabulary::place}." = "关于这一主题的通俗记述，请参阅 {@bt_site|::subscribed_books::vocabulary::place} 吟游诗人收集的歌谣。"
"For a more rigorous treatment, see the scholarly archives of {@bt_entity|::subscribed_books::vocabulary::entity}." = "关于更严谨的论述，请参阅 {@bt_entity|::subscribed_books::vocabulary::entity} 的学术档案。"
"For the truth -- well, the truth is what remains when all the accounts have been compared and the contradictions have been noted and the gaps have been acknowledged." = "至于真相——嗯，真相就是比较所有记述、记下矛盾并承认缺漏之后，最后剩下的东西。"
"This entry has been revised three times." = "本条已经修订了三次。"
"Each revision has made it more accurate and less satisfying." = "每次修订都让它更准确，却也更难让人满意。"
"There is an inverse relationship between truth and narrative comfort that the encyclopedist must simply accept." = "真实与叙事带来的慰藉之间成反比，百科编纂者必须接受这一点。"
"The word carries multiple meanings depending on context." = "这个词随语境不同，具有多种含义。"
"In formal speech, it denotes authority and permanence." = "在正式话语中，它表示权威和恒久。"
"In casual usage, it suggests something closer to stubbornness." = "在日常用语中，它的意思更接近固执。"
"The distinction is important, as confusing the two has been known to cause diplomatic incidents." = "这种区别很重要，因为混淆两者曾引发外交事件。"
"Pronunciation varies by region." = "发音因地区而异。"
"In the north, the emphasis falls on the first syllable, giving the word a clipped, martial quality." = "北方的重音落在第一音节上，使这个词短促而有军旅气息。"
"In the south, the emphasis shifts to the second syllable, producing a softer, more melodic sound." = "南方的重音移到第二音节，听起来更加柔和、富有旋律。"
"Speakers from {@bt_site|::subscribed_books::vocabulary::place} employ a third variation that other speakers find either charming or incomprehensible." = "{@bt_site|::subscribed_books::vocabulary::place} 的人采用第三种发音；其他地区的人，有的觉得迷人，有的完全听不懂。"
"The etymology of this term is disputed." = "这个词的词源尚有争议。"
"Some scholars trace it to an ancient root meaning \"to endure,\" while others connect it to a word meaning \"to build.\"" = "有些学者认为它来自表示“忍受”的古老词根，另一些则认为它与表示“建造”的词有关。"
"A third school of thought, smaller but not without merit, suggests it derives from a term meaning \"to argue,\" which would explain a great deal about {@bt_entity|::subscribed_books::vocabulary::entity}." = "第三种观点的支持者较少，却并非毫无道理：它认为此词源自“争论”，这倒能解释 {@bt_entity|::subscribed_books::vocabulary::entity} 的许多特点。"
"Usage note: this term is considered impolite in certain contexts." = "用法说明：在某些场合，这个词被认为不礼貌。"
"What those contexts are depends on who you ask." = "究竟是哪些场合，取决于你询问谁。"
"The safest approach is to avoid it entirely in formal settings and to use it freely among friends, who will forgive you if you are wrong." = "最稳妥的做法，是在正式场合完全不用，在朋友之间随意使用；即使你用错，他们也会原谅。"
"Related terms include several that the learner should not confuse." = "相关词中，有几个是学习者不应混淆的。"
"The difference between them is subtle but consequential." = "它们的差别很微妙，后果却不小。"
"One refers to a promise freely given." = "一个指自愿做出的承诺。"
"The other refers to a promise extracted under duress." = "另一个指在胁迫下做出的承诺。"
"The grammar is identical." = "语法完全相同。"
"The meaning is opposite." = "含义却截然相反。"
"This word has no direct equivalent in neighboring languages, which tells you something about the culture that produced it." = "这个词在相邻语言中没有直接对应词，这也体现了孕育它的文化特点。"
"Some concepts are so specific to a people that translation is not merely difficult but philosophically impossible." = "有些概念如此独属于某个民族，以至于翻译不只是困难，甚至在哲学意义上不可能。"
"The evolution of this technique can be traced through three distinct phases." = "这项技法的演进，可分为三个清晰的阶段。"
"The first, characterized by trial and error, lasted approximately two generations." = "第一阶段以试错为特点，持续了约两代人的时间。"
"The second, marked by systematic documentation, reduced the failure rate significantly." = "第二阶段以系统记录为标志，显著降低了失败率。"
"The third, which we now inhabit, combines the empirical knowledge of the first phase with the theoretical framework of the second." = "我们如今所处的第三阶段，将第一阶段的经验知识与第二阶段的理论框架结合起来。"
"The materials required have changed over time." = "所需材料随着时间改变。"
"Early practitioners used whatever was available, with predictably inconsistent results." = "早期从业者有什么就用什么，结果自然很不稳定。"
"The standardization of materials, driven by the guilds of {@bt_entity|::subscribed_books::vocabulary::entity}, represented a breakthrough that is often overlooked in favor of more dramatic innovations." = "由 {@bt_entity|::subscribed_books::vocabulary::entity} 行会推动的材料标准化是一项突破，却经常被那些更引人注目的创新掩盖。"
"A word about the human cost of this technology." = "再谈谈这项技术付出的人命代价。"
"Progress is not free." = "进步并非没有代价。"
"It is purchased with the labor of the many for the benefit of the few, and the ledger is not always balanced." = "它以多数人的劳动换取少数人的利益，而这笔账并不总是平衡。"
"The injuries sustained by early practitioners are documented in the medical records of {@bt_site|::subscribed_books::vocabulary::place}, and they make for sobering reading." = "早期从业者受到的伤害，记载于 {@bt_site|::subscribed_books::vocabulary::place} 的医疗记录中，读来令人警醒。"
"The current state of the art represents a plateau." = "当前的技术水平已经到达一个平台期。"
"Further advancement will require either new materials, new techniques, or new ways of thinking about the problem." = "进一步发展，需要新材料、新技法，或者思考问题的新方式。"
"History suggests that all three tend to arrive simultaneously, usually from an unexpected direction." = "历史表明，三者往往同时出现，而且通常来自意料之外的方向。"
"Critics of this technology argue that the costs outweigh the benefits." = "批评这项技术的人认为，其代价大于收益。"
"This argument has been made at every stage of development, and at every stage it has been wrong." = "每个发展阶段都有人提出这样的论点，而每次都被证明是错的。"
"Not because the costs are small -- they are not -- but because the benefits compound over time in ways that contemporaries cannot foresee." = "并非因为代价微小——它绝不微小——而是因为收益会以当时的人无法预见的方式，随时间不断累积。"
"The role of individual genius in this story is both overrated and underrated." = "个人天才在这段历史中的作用，既被高估，也被低估。"
"Overrated, because no innovation occurs in a vacuum." = "高估，是因为没有创新凭空发生。"
"Underrated, because at certain critical moments, one person's insight made the difference between stagnation and breakthrough." = "低估，是因为在某些关键时刻，一个人的洞见便能决定是停滞还是突破。"
"{@bt_hero|::subscribed_books::vocabulary::person} was one such person." = "{@bt_hero|::subscribed_books::vocabulary::person} 就是这样一个人。"
"The terrain in this region changes dramatically over short distances." = "本地区的地形在很短距离内就会发生剧烈变化。"
"A traveler might begin the day in dense forest, cross a river at midday, and find themselves in open grassland by evening." = "旅人清晨可能还在密林，正午横渡一条河，到傍晚已置身开阔草原。"
"The geological forces responsible for this variety are ancient and ongoing." = "造成这种多样性的地质力量古老而持久，至今仍在作用。"
"Water is the defining feature of this landscape." = "水是这片景观最鲜明的特征。"
"Rivers cut deep valleys through the stone." = "河流在岩石中切出深谷。"
"Springs bubble up in unexpected places." = "泉水从意想不到的地方涌出。"
"In wet seasons, the lowlands flood to a depth that makes travel impossible and farming pointless." = "雨季，低地的积水深得让旅行无法进行，也让耕种失去意义。"
"In dry seasons, the same lands become the most fertile in the region." = "旱季，同一片土地却成为本地区最肥沃之处。"
"The soil here is unusual." = "这里的土壤很特别。"
"Dark, rich, and slightly acidic, it supports a range of plant life found nowhere else in {@bt_entity|::subscribed_books::vocabulary::entity}." = "它色深、肥沃、略带酸性，养育了一系列在 {@bt_entity|::subscribed_books::vocabulary::entity} 其他地方找不到的植物。"
"The farmers of this region have learned to work with its peculiarities rather than against them, producing yields that their neighbors regard with undisguised envy." = "本地农民已经学会顺应土壤特点，而非与之对抗；他们的收成让邻居毫不掩饰地羡慕。"
"Elevation ranges from near sea level in the river valleys to considerable heights in the uplands." = "海拔从河谷接近海平面的低处，延伸到高地相当可观的高度。"
"The climate varies accordingly: mild and wet at low elevation, cold and dry at high." = "气候也随之变化：低处温和湿润，高处寒冷干燥。"
"The boundary between the two zones is abrupt and visible as a change in vegetation that can be observed from a great distance." = "两区的边界突然且清晰，植被变化从很远处就能看见。"
"Wildlife in this region is abundant but shy." = "本地区野生动物丰富，却很怕人。"
"The forests support populations of deer, wild boar, and several species of bird that are valued for both meat and plumage." = "森林中生活着鹿、野猪，以及数种兼具肉食和羽毛价值的鸟。"
"Predators are present but rarely seen." = "掠食动物也有，却很少见到。"
"The rivers contain fish in quantities that would astonish anyone accustomed to the depleted waterways of more settled areas." = "河中鱼类极多，习惯了人口稠密地区枯竭水道的人见了，都会惊讶。"
"The roads, such as they are, follow the paths of least resistance through the terrain." = "这里勉强称得上道路的路，沿着地形中最容易通行的路径延伸。"
"This means they follow rivers where possible, skirt the bases of hills rather than crossing them, and avoid the low-lying areas that become impassable after rain." = "因此，道路尽量沿河而行，绕过山脚而非越过山丘，也避开雨后无法通行的洼地。"
"A map of the roads is, in effect, a map of the obstacles." = "道路图，实际上也就是障碍图。"
"The constellation known to the people of {@bt_entity|::subscribed_books::vocabulary::entity} as the Forge is visible in the northern sky from midsummer to the first frost." = "{@bt_entity|::subscribed_books::vocabulary::entity} 人民称为“熔炉”的星座，从仲夏到初霜期间，可见于北方天空。"
"Its seven brightest stars form the shape of an anvil, and the faintest -- visible only on the clearest nights -- represents the hammer." = "其中最亮的七颗星组成铁砧的形状，而最暗的一颗——只有极晴朗的夜晚才能看见——代表锤子。"
"Navigators use the Forge to find true north when clouds obscure the pole star." = "云遮住极星时，领航者会用熔炉座寻找正北。"
"The movements of the wandering stars have been tracked by the astronomers of {@bt_site|::subscribed_books::vocabulary::place} for generations." = "{@bt_site|::subscribed_books::vocabulary::place} 的天文学者已经连续数代追踪游星的运动。"
"Their records, meticulously maintained on clay tablets and later on paper, show patterns that repeat over cycles longer than any individual lifetime." = "他们最初在泥板、后来在纸上细致保存的记录，揭示了周期长于任何个人寿命的重复规律。"
"The implications are still being debated." = "其中的含义仍在争论。"
"There is a star -- faint, reddish, easily overlooked -- that the elders of {@bt_entity|::subscribed_books::vocabulary::entity} call the Watcher." = "有一颗黯淡、偏红、容易被忽略的星，{@bt_entity|::subscribed_books::vocabulary::entity} 的长者称它为“守望者”。"
"It sits near the horizon and never moves." = "它停在地平线附近，从不移动。"
"Some say it is a guardian." = "有人说，它是守护者。"
"Others say it is a warning." = "另一些人说，它是一则警告。"
"The astronomers say it is simply very far away, which is the least romantic explanation and probably the correct one." = "天文学者说，它只是非常遥远；这是最不浪漫的解释，却也很可能是正确的。"
"The sky above {@bt_site|::subscribed_books::vocabulary::place} is exceptional for observation." = "{@bt_site|::subscribed_books::vocabulary::place} 上方的天空极其适合观测。"
"The elevation, the dry air, and the distance from any settlement large enough to produce light interference combine to create conditions that astronomers from across {@bt_entity|::subscribed_books::vocabulary::entity} travel considerable distances to exploit." = "较高的海拔、干燥的空气，以及远离足以产生光干扰的大型聚落，合在一起构成了出色的条件，让 {@bt_entity|::subscribed_books::vocabulary::entity} 各地的天文学者不惜远行而来。"
"Eclipses are recorded in the annals of {@bt_entity|::subscribed_books::vocabulary::entity} with a mixture of scientific precision and superstitious dread." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的编年史对日月食的记载，兼有科学的精确与迷信的恐惧。"
"The astronomers calculate their occurrence with impressive accuracy." = "天文学者能够极其准确地计算其发生时间。"
"The populace interprets them as omens." = "民众则把它们视为征兆。"
"Both groups, in their own way, are paying attention to the sky." = "两群人都以各自的方式，关注着天空。"
"Entry: A bright blue-white star of the first magnitude, positioned at the apex of the Hunter constellation." = "条目：一颗明亮的蓝白色一等星，位于猎人座的顶端。"
"The people of {@bt_entity|::subscribed_books::vocabulary::entity} call it the Eye." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的人民称它为“眼睛”。"
"It is used for navigation throughout the winter months and features prominently in the mythology of no fewer than three neighboring cultures." = "整个冬季都可用它领航，而且至少有三个相邻文化的神话把它放在显要位置。"
"Entry: A binary system visible to the naked eye as a single point of orange light." = "条目：一个双星系统，肉眼看来是一个橙色光点。"
"Close observation reveals that its brightness fluctuates over a period of approximately forty days." = "细致观测表明，它的亮度以大约四十天为周期变化。"
"The astronomers of {@bt_site|::subscribed_books::vocabulary::place} were the first to document this variation, though they could not explain it." = "{@bt_site|::subscribed_books::vocabulary::place} 的天文学者最先记录了这种变化，却无法解释。"
"Entry: A faint cluster of stars known collectively as the Swarm." = "条目：一个黯淡的星团，统称为“群集”。"
"Individual members are difficult to resolve without optimal conditions, but the cluster as a whole is visible as a hazy patch of light in the southern sky." = "若没有最佳条件，很难分辨其中的单颗星；但整个星团可见为南方天空中一片朦胧的光斑。"
"Its distance from the observer is unknown and likely unknowable with current methods." = "它与观测者的距离尚不清楚，以目前的方法很可能也无法确定。"
"Entry: The pole star, around which all other stars appear to rotate." = "条目：极星，其他所有星看起来都绕着它旋转。"
"It is the fixed point of the heavens, the single certainty in a sky of perpetual movement." = "它是天穹的定点，是不断运动的天空中唯一的确定。"
"Every navigator, every traveler, every lost soul who has ever looked up has found comfort in its constancy." = "每个领航者、每个旅人，以及每个曾抬头仰望的迷途灵魂，都曾从它的恒定中得到安慰。"
"The greeting customs of {@bt_entity|::subscribed_books::vocabulary::entity} reveal much about its values." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的问候习俗，揭示了许多价值观。"
"Where neighboring cultures embrace upon meeting, the people of {@bt_entity|::subscribed_books::vocabulary::entity} maintain a formal distance, acknowledging each other with a nod that is simultaneously respectful and guarded." = "相邻文化的人见面时会拥抱，而 {@bt_entity|::subscribed_books::vocabulary::entity} 的人民保持着正式的距离，以一个既尊重又戒备的点头相互致意。"
"This is not coldness; it is a form of respect that prioritizes personal space over physical warmth." = "这并非冷漠，而是一种尊重：比起身体接触的热情，他们更重视个人空间。"
"Dietary practices differ markedly." = "饮食习惯存在显著差异。"
"{@bt_entity|::subscribed_books::vocabulary::entity} favors preserved foods -- smoked, salted, dried -- reflecting a history of long winters and uncertain supply lines." = "{@bt_entity|::subscribed_books::vocabulary::entity} 偏爱烟熏、盐腌、风干等贮藏食品，反映了漫长冬季和不稳定补给线的历史。"
"Neighboring cultures, blessed with milder climates, favor fresh preparation and regard {@bt_entity|::subscribed_books::vocabulary::entity}'s cuisine with a mixture of curiosity and pity." = "相邻文化得益于更温和的气候，偏爱新鲜烹制的食物，并以好奇与怜悯交织的眼光看待 {@bt_entity|::subscribed_books::vocabulary::entity} 的饮食。"
"The attitude toward death is perhaps the most revealing point of comparison." = "对死亡的态度，也许是最能揭示差异的比较点。"
"{@bt_entity|::subscribed_books::vocabulary::entity} treats death with a matter-of-factness that outsiders sometimes mistake for callousness." = "{@bt_entity|::subscribed_books::vocabulary::entity} 以平实的态度看待死亡，外来者有时会把这误认为冷酷。"
"The dead are mourned briefly and remembered permanently." = "死者受到短暂的哀悼，却被永久铭记。"
"Neighboring cultures reverse this pattern: elaborate funerals followed by gradual forgetting." = "相邻文化恰好相反：先举行盛大的葬礼，随后逐渐遗忘。"
"Artistic expression in {@bt_entity|::subscribed_books::vocabulary::entity} tends toward the functional." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的艺术表达偏重实用。"
"Buildings are sturdy rather than beautiful." = "建筑重坚固而不重美丽。"
"Clothing is practical rather than decorative." = "衣物重实用而不重装饰。"
"Music is rhythmic rather than melodic." = "音乐重节奏而不重旋律。"
"This is not a failure of imagination but a statement of priorities, and it is a statement that {@bt_entity|::subscribed_books::vocabulary::entity} makes with absolute consistency." = "这不是缺乏想象力，而是在表达重视的先后次序；{@bt_entity|::subscribed_books::vocabulary::entity} 始终如一地表达着这种次序。"
"The concept of honor in {@bt_entity|::subscribed_books::vocabulary::entity} differs from that of its neighbors in one crucial respect: it is collective rather than individual." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的荣誉观与邻国有一个关键区别：荣誉属于集体，而非个人。"
"A dishonor to one is a dishonor to all." = "一人受辱，便是所有人受辱。"
"This makes {@bt_entity|::subscribed_books::vocabulary::entity}'s people formidable allies and dangerous enemies, because no slight goes unaddressed and no debt goes unpaid." = "这使 {@bt_entity|::subscribed_books::vocabulary::entity} 的人民成为强大的盟友，也成为危险的敌人，因为任何轻慢都不会被忽略，任何欠债都不会不了了之。"


# 声明内生成变化的规范形变体；原作者句式保留。
[[rulesets]]
name = "shared"
[rulesets.rules]
"like the first light breaking upon a uncharted shore" = "如曙光初照未知的海岸"
"like the first light breaking upon a uncharted shore." = "如曙光初照未知的海岸。"

[[rulesets]]
name = "chronicle"
[rulesets.rules]
"All great things come to a end." = "一切伟大之物都有终结之日。"
"The story of {@bt_entity|::subscribed_books::vocabulary::entity} ends not with a crash, but with the turning of a empty page." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的故事并非结束于轰然巨响，而是终结于一张空白书页的翻动。"
"{person} ascended to {role} in {@year}, fulfilling a ancient prophecy known only to the wise." = "{@year} 年，{person} 升任 {role}，应验了只有智者知晓的古老预言。"

[[rulesets]]
name = "biography"
[rulesets.rules]
"This biography attempts a honest account." = "这部传记试图如实记述。"
"Everyone has a opinion about {person}." = "每个人都对 {person} 有自己的看法。"

[[rulesets]]
name = "autobiography"
[rulesets.rules]
"This is my life, as remembered by a old {race} with a long memory and a {adj} heart." = "这便是我的人生，由一个记忆悠长、心怀{adj}的年老 {race} 回忆而成。"

[[rulesets]]
name = "cultural"
[rulesets.rules]
"From {@bt_site|::subscribed_books::vocabulary::place}, they built a empire of {adj} brilliance." = "他们以 {@bt_site|::subscribed_books::vocabulary::place} 为起点，建立了一个闪耀着{adj}光芒的帝国。"
"This history seeks a honest answer." = "这部历史试图寻找一个诚实的答案。"
"The author acknowledges that objectivity is a aspiration rather than a achievement, and that the {adj} complexity of any civilization resists reduction to a single narrative." = "作者承认，客观性是一种追求，尚非已经实现的成果；任何文明{adj}复杂性，都无法被简化为单一叙事。"

[[rulesets]]
name = "alternate"
[rulesets.rules]
"In this imagined history, the founding of {@bt_site|::subscribed_books::vocabulary::place} in {@year} led to a age of unprecedented prosperity." = "在这段想象的历史中，{@year} 年 {@bt_site|::subscribed_books::vocabulary::place} 的建立引来一个空前繁荣的时代。"
"It is a elegy for a future that never arrived." = "这是献给从未到来之未来的挽歌。"

[[rulesets]]
name = "genealogy"
[rulesets.rules]
"From a unremarkable root to this recorded tree: the pedigree of {person}, as it stands." = "从平凡的根源到这棵有记录的族谱树：这便是 {person} 家谱的现状。"

[[rulesets]]
name = "expansion"
[rulesets.rules]
"There is a tendency among scholars of {@bt_entity|::subscribed_books::vocabulary::entity} to treat this period as a aberration -- a deviation from the natural order." = "{@bt_entity|::subscribed_books::vocabulary::entity} 的学者往往把这段时期视为异常——偏离自然秩序的插曲。"
"What happened was not merely a political event or a economic event." = "发生的不只是一桩政治事件或经济事件。"
"SPEAKER: That sounds like a excuse." = "发问者：这听起来像借口。"
"A old {race} who speaks little but sees everything." = "一个年老的 {race}，话不多，却看得清一切。"
"The brewery is the oldest operating business in the settlement and produces a ale that is, by all accounts, a acquired taste." = "酿酒坊是聚落中仍在营业的最古老商号；据说它酿出的麦酒，必须喝惯了才会喜欢。"
"There is a inverse relationship between truth and narrative comfort that the encyclopedist must simply accept." = "真实与叙事带来的慰藉之间成反比，百科编纂者必须接受这一点。"
"Some scholars trace it to a ancient root meaning \"to endure,\" while others connect it to a word meaning \"to build.\"" = "有些学者认为它来自表示“忍受”的古老词根，另一些则认为它与表示“建造”的词有关。"
"History suggests that all three tend to arrive simultaneously, usually from a unexpected direction." = "历史表明，三者往往同时出现，而且通常来自意料之外的方向。"
"Its seven brightest stars form the shape of a anvil, and the faintest -- visible only on the clearest nights -- represents the hammer." = "其中最亮的七颗星组成铁砧的形状，而最暗的一颗——只有极晴朗的夜晚才能看见——代表锤子。"

